version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: agentforge-postgres-test
    environment:
      POSTGRES_DB: agentforge_test
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
