services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
    ports:
      # The published host port is overridable (POSTGRES_PORT) so a developer with a
      # busy 5432 can still run the local stack; the default is unchanged.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentforge-postgres:
