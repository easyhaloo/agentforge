version: '3.8'

services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_DB: agentforge_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d agentforge_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: ../../../backend/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://test_user:test_password@postgres-test:5432/agentforge_test?sslmode=disable
      PORT: 8080
      LOG_LEVEL: debug
    ports:
      - "8081:8080"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-test-data:
