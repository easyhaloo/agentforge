name: Prepare Monaco dependency lockfile

on:
  push:
    branches:
      - feat/webide-monaco-lazy-loading
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Add pinned Monaco dependency to the current main workspace and regenerate lockfile
        run: npm install --prefix apps/web --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact monaco-editor@0.57.0
      - name: Verify lockfile consistency
        run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: monaco-dependency-lockfile-main
          path: |
            apps/web/package.json
            apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 3
