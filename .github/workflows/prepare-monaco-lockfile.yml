name: Prepare Monaco lockfile

on:
  push:
    branches:
      - feat/webide-monaco-lazy-loading
    paths:
      - .github/workflows/prepare-monaco-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webide-monaco-lazy-loading
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Add the pinned stable Monaco dependency and generate lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact monaco-editor@0.57.0
      - name: Verify clean installation from lockfile
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already match the requested Monaco version."
            exit 0
          fi
          git commit -m "build(web): add pinned Monaco editor dependency"
          git push origin HEAD:feat/webide-monaco-lazy-loading
