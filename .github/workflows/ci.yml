name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'wrangler.jsonc'
            api:
              - 'backend/api/**'
            contracts:
              - 'contracts/openapi/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Playwright 1.56 supports Ubuntu 24.04; pin the runner for browser reproducibility.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run application and shared UI browser tests
        run: npm run test:e2e

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agentforge:agentforge@localhost:5432/agentforge_test?sslmode=disable
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/api/go.mod
      - run: go mod tidy
      - run: go test ./...
        env:
          TEST_PIPELINE_DOCKER: "1"
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: go build ./cmd/server
      - name: Validate production container
        run: docker build --tag agentforge-api:ci .

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint contracts/openapi/openapi.yaml

  # Stable required check for GitHub branch protection. Module jobs may be
  # skipped when their paths do not change; skipped jobs are accepted here.
  ci-gate:
    name: ci-gate
    needs: [changes, web, api, contracts]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.contracts.result == 'success' || needs.contracts.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Report CI result
        run: echo "All applicable CI checks passed."
