name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'backend/api/**'
              - 'compose.yaml'
              - 'Makefile'
              - 'scripts/dev-stack.sh'
              - '.github/workflows/ci.yml'
            api:
              - 'backend/api/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/openapi/**'

  # Many postgres-package tests connect to DATABASE_URL directly and leave
  # fixtures behind. Developers share one long-lived database, so a test that
  # only passes on a fresh database passes CI and breaks locally (or the
  # reverse). This job runs the same suite against a deliberately dirtied
  # database to surface that class of failure before merge.
  api-dirty-db:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agentforge:agentforge@localhost:5432/agentforge_test?sslmode=disable
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/api/go.mod
      - run: go mod tidy
      - name: Seed the database with leftover fixtures (run the suite twice against one database)
        run: |
          go test -count=1 ./internal/platform/postgres/ > /dev/null 2>&1 || true
          go test -count=1 ./internal/platform/postgres/ > /dev/null 2>&1 || true
      - name: Run backend tests against the dirtied database
        run: go test -count=1 ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Playwright 1.56 supports Ubuntu 24.04; pin the runner for browser reproducibility.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/api/go.sum
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Check translation resources
        working-directory: apps/web
        run: npm run check:i18n
      - name: Run frontend unit tests
        working-directory: apps/web
        run: npm test
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests, including real API flows
        working-directory: apps/web
        env:
          AGENTFORGE_TEST_ORIGIN: http://127.0.0.1:4173
          GIT_SMART_HTTP_ENABLED: "1"
          RUN_DIR: ${{ runner.temp }}/agentforge-web-e2e
        run: npm run test:e2e -- --reporter=list,html
      - name: Show test stack logs on failure
        if: failure()
        run: tail -n 80 "${{ runner.temp }}/agentforge-web-e2e/"*.log 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agentforge:agentforge@localhost:5432/agentforge_test?sslmode=disable
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/api/go.mod
      - run: go mod tidy
      - name: Install MinIO test server
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=RELEASE.2025-09-07T16-13-09Z
          gh release download "$release" --repo minio/minio --pattern "minio.linux-amd64.$release" --output minio
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  minio" | sha256sum --check
          chmod +x minio
      - name: Run backend tests with PostgreSQL and MinIO
        run: go test -count=1 -v ./...
        env:
          TEST_MINIO_BINARY: ${{ runner.temp }}/minio
          TEST_PIPELINE_DOCKER: "1"
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: go build ./cmd/server
      - name: Validate production container
        run: docker build --tag agentforge-api:ci .
      - name: Verify Git tooling in the integration API image
        run: |
          docker build --target integration-api --tag agentforge-integration-api:ci .
          docker run --rm --entrypoint sh agentforge-integration-api:ci -ec 'test "$(id -u)" != 0 && test -x "$(git --exec-path)/git-remote-https" && git --version'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint contracts/openapi/openapi.yaml
