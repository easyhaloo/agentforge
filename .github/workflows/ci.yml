name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'wrangler.jsonc'
            api:
              - 'backend/api/**'
            contracts:
              - 'contracts/openapi/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/api/go.mod
      - run: go test ./...
      - run: go build ./cmd/server

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint contracts/openapi/openapi.yaml

  # This stable, always-running check is the only check that branch protection
  # needs to require. It fails on any failed/cancelled required job while
  # allowing path-filtered jobs to be skipped when their area did not change.
  required-ci:
    name: required-ci
    if: always()
    needs: [changes, web, api, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Validate CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          set -euo pipefail
          for result in "$CHANGES_RESULT" "$WEB_RESULT" "$API_RESULT" "$CONTRACTS_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI is not mergeable: an upstream job ended with $result."
              exit 1
            fi
          done
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "CI is not mergeable: change detection did not succeed."
            exit 1
          fi
          echo "All applicable CI jobs succeeded."
