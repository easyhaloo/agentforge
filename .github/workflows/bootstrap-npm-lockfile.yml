name: Bootstrap npm lockfile

on:
  push:
    branches:
      - chore/bootstrap-npm-lockfile

permissions:
  contents: write

concurrency:
  group: bootstrap-npm-lockfile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bootstrap-npm-lockfile
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile from workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-npm-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/bootstrap-npm-lockfile.yml
          git commit -m "chore(deps): add reproducible npm lockfile"
          git push origin HEAD:chore/bootstrap-npm-lockfile
