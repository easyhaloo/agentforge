name: Generate npm lockfile
# Regenerate lockfile artifact for the pinned Shiki dependency.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/generate-lockfile.yml'

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile with clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
