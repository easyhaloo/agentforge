openapi: 3.1.0
info: {title: Git merge previews, version: 1.0.0}
paths:
  /api/v1/organizations/{organizationID}/merge-preview/capabilities:
    parameters: [{$ref: '#/components/parameters/Org'}]
    get:
      operationId: getMergePreviewCapabilities
      summary: Query support for ordered merge simulation
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Provider capabilities
          content:
            application/json:
              schema:
                type: object
                required: [orderedMergePreview]
                properties: {orderedMergePreview: {type: boolean}}
        4XX: {$ref: './openapi.yaml#/components/responses/Problem'}
  /api/v1/organizations/{organizationID}/merge-preview:
    parameters: [{$ref: '#/components/parameters/Org'}]
    post:
      operationId: previewOrderedMerge
      summary: Test an ordered sequence of sources against a pinned target
      security: [{sessionCookie: [], csrfCookie: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, target, sources]
              additionalProperties: false
              properties:
                repository: {type: string}
                target: {type: string}
                sources: {type: array, minItems: 1, maxItems: 32, items: {type: string}}
      responses:
        '200':
          description: Clean candidate or conflict at the zero-based source index
          content:
            application/json:
              schema:
                type: object
                required: [status, target, sources]
                properties:
                  status: {type: string, enum: [clean, conflict]}
                  target: {$ref: '#/components/schemas/PinnedRef'}
                  sources: {type: array, items: {$ref: '#/components/schemas/PinnedRef'}}
                  candidateSHA: {type: string}
                  treeSHA: {type: string}
                  conflictAt: {type: integer, minimum: 0}
                  conflictPaths: {type: array, items: {type: string}}
        4XX: {$ref: './openapi.yaml#/components/responses/Problem'}
        5XX: {$ref: './openapi.yaml#/components/responses/Problem'}
components:
  parameters:
    Org: {name: organizationID, in: path, required: true, schema: {type: string}}
  schemas:
    PinnedRef:
      type: object
      required: [ref, sha]
      properties: {ref: {type: string}, sha: {type: string}}
  securitySchemes:
    sessionCookie: {$ref: './openapi.yaml#/components/securitySchemes/sessionCookie'}
    csrfCookie: {$ref: './openapi.yaml#/components/securitySchemes/csrfCookie'}
    csrfToken: {$ref: './openapi.yaml#/components/securitySchemes/csrfToken'}
