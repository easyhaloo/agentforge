                  id: { type: string }
                  created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/subscription:
    parameters:
      - $ref: "#/components/parameters/organizationID"
      - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: repository, in: query, required: true, schema: { type: string } }
    get:
      operationId: getIssueSubscription
      summary: Get current subscription for the caller
      tags: [Issues]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current subscription state
          content:
            application/json:
              schema:
                type: object
                required: [subscribed]
                properties:
                  subscribed: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: subscribeToIssue
      summary: Subscribe to issue activity
      tags: [Issues]
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "200":
          description: Current subscription state
          content:
            application/json:
              schema:
                type: object
                required: [subscribed]
                properties:
                  subscribed: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unsubscribeFromIssue
      summary: Unsubscribe from issue activity
      tags: [Issues]
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "200":
          description: Current subscription state
          content:
            application/json:
              schema:
                type: object
                required: [subscribed]
                properties:
                  subscribed: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/reactions:
    parameters:
      - $ref: "#/components/parameters/organizationID"
      - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: repository, in: query, required: true, schema: { type: string } }
    get:
      operationId: listIssueReactions
      summary: List reactions to the issue description
      tags: [Issues]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Issue reactions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: [array, "null"]
                    items: { $ref: "#/components/schemas/Reaction" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addIssueReaction
      summary: Add a reaction to the issue description
      tags: [Issues]
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, enum: ["+1", "-1", laugh, confused, heart, hooray, rocket, eyes] }
      responses:
        "201":
          description: Reaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/reactions/{reactionID}:
    parameters:
      - $ref: "#/components/parameters/organizationID"
      - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: repository, in: query, required: true, schema: { type: string } }
      - { name: reactionID, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeIssueReaction
      summary: Remove the caller’s issue reaction
      tags: [Issues]
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204":
          description: Reaction removed
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

# ==================== Components ====================
components:
  parameters:
    organizationID:
      name: organizationID
      in: path
      required: true
      description: Organization slug or ID
      schema: { type: string }

  responses:
    IssueGitHubSource:
      description: Stored GitHub source snapshot or null when no issue is linked
      content:
        application/json:
          schema:
            type: [object, 'null']
            required: [url, fetched_at, references]
            properties:
              url: { type: string, format: uri }
              fetched_at: { type: string, format: date-time }
              references:
                type: array
                items:
                  type: object
                  required: [url, actor, title, number, created_at]
                  properties:
                    url: { type: string, format: uri }
                    actor: { type: string }
                    title: { type: string }
                    number: { type: integer, minimum: 1 }
                    created_at: { type: string, format: date-time }
    UpdatedIssue:
      description: Updated issue
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Issue" }
    Problem:
      description: RFC 9457 Problem response
      content:
        application/json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }

  schemas:
    # ==================== Issue Schemas ====================
    IssueProject:
      type: object
      required: [id, name, number]
      properties:
        id: { type: string }
        number: { type: integer, minimum: 1, description: Stable number within the organization. }
        name: { type: string }
        repository: { type: string }
        recent: { type: boolean, description: The caller added this project to an issue in the last 30 days. }

    IssueSummary:
      type: object
      required: [id, number, title, state]
      properties:
        id: { type: string }
        number: { type: integer, minimum: 1 }
        title: { type: string }
        state: { type: string, enum: [open, closed] }

    Issue:
      type: object
      required: [id, number, repository, title, body, state, locked, comments, labels, assignees, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        number:
          type: integer
          minimum: 1
          description: Sequential number within repository (#1, #2, #3, ...)
        repository:
          type: string
          description: Repository slug (e.g., "owner/repo")
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          maxLength: 65536
          description: Markdown content
        state:
          type: string
          enum: [open, closed]
        state_reason:
          type: string
          enum: [completed, not_planned, duplicate]
          description: Reason for closure (only when state=closed)
        milestone_id:
          type: string
          description: Associated milestone ID
        milestone_title: { type: string }
        created_by_name: { type: string }
        lock_reason: { type: string, enum: [off-topic, 'too heated', resolved, spam] }
        locked_by: { type: string }
        locked_at: { type: string, format: date-time }
        custom_fields:
          type: object
          additionalProperties: { type: string }
        commits:
          type: array
          items:
            type: object
            required: [sha, subject]
            properties:
              sha: { type: string, description: Full Git commit SHA. }
              subject: { type: string }
        closing_pull_requests:
          type: array
          description: Pull requests in the organization whose descriptions reference this issue with a closing keyword and whose base is the default branch. Separate from editable Changeset links.
          items:
            type: object
            required: [id, title, repository]
            properties:
              id: { type: string, description: Stable Changeset ID of the pull request. }
              title: { type: string }
              repository: { type: string }
        changesets:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, description: Stable Changeset ID. }
              title: { type: string }
        projects:
          type: array
          items: { $ref: "#/components/schemas/IssueProject" }
        issue_type:
          type: string
          enum: [task, bug, feature]
        locked:
          type: boolean
          description: Whether the issue is locked
        comments:
          type: integer
          minimum: 0
          description: Number of comments
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        assignees:
          type: array
          items:
            type: object
            required: [user_id]
            properties:
              user_id: { type: string }
              display_name: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        closed_by: { type: string }

    IssueCreate:
      type: object
      required: [repository, title]
      properties:
        repository:
          type: string
          description: Repository slug (e.g., "owner/repo")
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          description: Optional Markdown. The browser editor limits input to 65536 characters.
        assignees:
          type: array
          description: Organization member user IDs.
          items: { type: string }
        label_ids:
          type: array
          description: Label IDs belonging to this repository.
          items: { type: string }
        milestone_id:
          type: string
          description: Milestone ID belonging to this repository.
        issue_type:
          type: string
          enum: ['', task, bug, feature]
        project_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Organization-wide and same-repository project IDs. Requires an organization owner or admin.
          items: { type: string, minLength: 32, maxLength: 32 }
        attachment_ids:
          type: array
          maxItems: 20
          description: Unexpired staged file IDs owned by the caller for this repository. Every staged URL must appear in the Markdown body.
          items: { type: string, pattern: '^[a-f0-9]{32}$' }

        parent_number:
          type: integer
          minimum: 1
          description: Number of a parent in the same repository. The caller needs permission to manage the parent.

    IssueUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          maxLength: 65536

        expected_updated_at: { type: string, format: date-time }
        custom_fields:
          type: object
          maxProperties: 20
          propertyNames: { minLength: 1, maxLength: 64 }
          additionalProperties: { type: string, maxLength: 500 }
          description: Replace all custom text fields. Use an empty object to clear.
        changeset_ids:
          type: array
          maxItems: 100
          description: Replace links to same-repository Changesets. Use an empty array to clear.
          items: { type: string }
        assignees:
          type: array
          maxItems: 100
          items: { type: string }
        label_ids:
          type: array
          maxItems: 100
          items: { type: string }
        project_ids:
          type: array
          maxItems: 100
          items: { type: string }
        milestone_id: { type: string, description: Use an empty string to clear. }
        issue_type: { type: string, enum: ['', task, bug, feature] }

    IssuePage:
      type: object
      required: [items, total, open_total, closed_total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        total:
          type: integer
          minimum: 0
          description: Total matching issues before pagination, including the state filter.
        open_total:
          type: integer
          minimum: 0
          description: Matching open issues before pagination, ignoring the state filter.
        closed_total:
          type: integer
          minimum: 0
          description: Matching closed issues before pagination, ignoring the state filter.
        limit: { type: integer }
        offset: { type: integer }
        filter_options:
          type: object
          description: Distinct values used by repository issues across all states, independent of active filters and pagination. Returned when include_filter_options is true.
          required: [authors, labels, assignees, milestones]
          properties:
            authors:
              type: array
              items: { type: string }
              description: Creator user IDs
            labels:
              type: array
              items: { type: string }
              description: Label names
            assignees:
              type: array
              items: { type: string }
              description: Assignee user IDs
            milestones:
              type: array
              items: { type: string }
              description: Milestone IDs

    # ==================== Comment Schemas ====================
    Comment:
      type: object
      required: [id, resource_type, resource_id, body, author_id, created_at, updated_at, minimized, version]
      properties:
        id: { type: string }
        resource_type:
          type: string
          enum: [issue, changeset]
        resource_id: { type: string }
        body:
          type: string
          minLength: 1
          maxLength: 65536
        author_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time }
        minimized: { type: boolean }
        version: { type: integer, minimum: 1 }
        minimized_reason:
          type: string
          enum: [spam, off-topic, outdated, resolved]
        reactions:
          type: array
          items: { $ref: "#/components/schemas/Reaction" }

    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536

    # ==================== Reaction Schema ====================
    Reaction:
      type: object
      required: [id, content, user_id, created_at]
      properties:
        id: { type: string }
        content:
          type: string
          enum: ["+1", "-1", laugh, confused, heart, hooray, rocket, eyes]
          description: GitHub-compatible emoji
        user_id: { type: string }
        created_at: { type: string, format: date-time }

    # ==================== Label Schema ====================
    Label:
      type: object
      required: [id, name, description, color, created_at]
      properties:
        id: { type: string }
        name:
          type: string
          minLength: 1
          maxLength: 100
        description: { type: string }
        color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"
          description: Hex color without # (e.g., "d73a4a")
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LabelCreate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description: { type: string }
        color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"

    # ==================== Milestone Schema ====================
    Milestone:
      type: object
      required: [id, title, description, state, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date-time }
        state: { type: string, enum: [open, closed] }
        open_issues: { type: integer, minimum: 0 }
        closed_issues: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }

    MilestoneCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date-time }

    # ==================== Event Schema ====================
    IssueEvent:
      type: object
      required: [id, event_type, created_at]
      properties:
        id: { type: string }
        event_type:
          type: string
          enum: [created, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned, renamed, edited, locked, unlocked, linked_changeset, unlinked_changeset, commented, mentioned, referenced]
        issue_id: { type: string }
        actor_id: { type: string }
        metadata: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
