openapi: 3.1.0
info:
  title: AgentForge Issues API
  version: 1.0.0
  description: GitHub-compatible Issue tracking, Comments, Labels, and Milestones

paths:
  # ==================== Issues ====================
  /api/v1/organizations/{organizationID}/issues:
    get:
      operationId: listIssues
      summary: List issues with filtering and pagination
      security: [{ sessionCookie: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: repository
          in: query
          description: Filter by repository slug (e.g., "owner/repo")
          schema: { type: string }
        - name: linked_changeset
          in: query
          description: Filter by an explicitly linked Changeset ID. Requires repository.
          schema: { type: string, maxLength: 128 }
        - name: state
          in: query
          description: Filter by state. Omit to include both open and closed issues.
          schema: { type: string, enum: [open, closed] }
        - name: created_by
          in: query
          description: Filter by creator user ID
          schema: { type: string }
        - name: assignee
          in: query
          description: Filter by assignee user ID.
          schema: { type: string }
        - name: labels
          in: query
          description: Filter by one exact label name.
          schema: { type: string }
        - name: milestone
          in: query
          description: Filter by milestone ID.
          schema: { type: string }
        - name: since
          in: query
          description: Filter by updated_at >= timestamp
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: 'Search title and body, or enter # followed by an issue number for an exact match.'
          schema: { type: string }
        - name: sort
          in: query
          description: Sort field
          schema: { type: string, enum: [created, updated, comments], default: updated }
        - name: direction
          in: query
          description: Sort direction
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          description: Maximum issues to return
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Number of matching issues to skip
          schema: { type: integer, minimum: 0, default: 0 }
        - name: include_filter_options
          in: query
          description: Return distinct filter values across the repository. Requires repository.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIssue
      summary: Create a new issue
      description: Issue metadata and staged attachments are saved atomically with the new issue. Only organization owners and admins can set assignees, labels, milestone, type, or projects.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCreate" }
      responses:
        "201":
          description: Issue created successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/member-mentions:
    get:
      operationId: findIssueMemberMentions
      summary: Find active organization members for an Issue mention
      description: Requires the organization role needed to create issues. Matches a handle or display name without exposing email or membership details.
      security: [{ sessionCookie: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Matching organization members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 6
                    items:
                      type: object
                      required: [username, display_name]
                      properties:
                        username: { type: string }
                        display_name: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/references:
    get:
      operationId: resolveIssueReferences
      summary: Resolve existing issue numbers in one repository
      security: [{ sessionCookie: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: repository
          in: query
          required: true
          schema: { type: string }
        - name: number
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: integer, format: int32, minimum: 1 }
      responses:
        "200":
          description: Existing issue numbers in ascending order
          content:
            application/json:
              schema:
                type: array
                items: { type: integer, format: int32, minimum: 1 }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/github-reference:
    get:
      operationId: resolvePublicGitHubIssueReference
      summary: Identify a public GitHub issue or pull request
      description: Queries GitHub anonymously using only the supplied repository and number.
      security: [{ sessionCookie: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: repository
          in: query
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9-]{1,39}/[a-zA-Z0-9_.-]{1,100}$' }
        - name: number
          in: query
          required: true
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        "200":
          description: The canonical GitHub route segment and reference summary
          content:
            application/json:
              schema:
                type: object
                required: [kind, title, state]
                properties:
                  kind: { type: string, enum: [issues, pull] }
                  title: { type: string }
                  state: { type: string, enum: [open, closed, merged] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/github-pull-search:
    get:
      operationId: searchPublicGitHubPullRequests
      summary: Find up to six pull requests in one public GitHub repository
      description: Queries GitHub anonymously by exact number or optional title keyword. Issues are excluded.
      security: [{ sessionCookie: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: repository
          in: query
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9-]{1,39}/[a-zA-Z0-9_.-]{1,100}$' }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Matching pull requests, if any
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 6
                    items:
                      type: object
                      required: [number, title]
                      properties:
                        number: { type: integer, minimum: 1 }
                        title: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issue-projects:
    parameters:
      - $ref: "#/components/parameters/organizationID"
    get:
      operationId: listIssueProjects
      summary: List available issue projects
      tags: [Issues]
      description: With a repository, returns organization-wide projects and projects scoped to that repository. Recent is specific to the caller.
      security:
        - sessionCookie: []
      parameters:
        - name: repository
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Issue projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IssueProject" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIssueProject
      summary: Create an organization or repository issue project
      description: Requires an organization owner or admin. Names are case-insensitive within a scope.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                repository: { type: string, description: Omit for an organization-wide project. }
      responses:
        "201":
          description: Issue project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueProject" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issue-attachments:
    post:
      operationId: stageIssueAttachment
      summary: Upload a file for an issue draft
      description: Send the raw file bytes. Images and videos are limited to 10 MiB, other supported files to 25 MiB. Drafts expire after 24 hours. Each uploader in an organization can have up to 100 pending files totaling up to 100 MiB.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: repository
          in: query
          required: true
          schema: { type: string }
        - name: filename
          in: query
          required: true
          description: File name including a supported extension, up to 255 UTF-8 bytes. Path separators and control characters are not allowed.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "201":
          description: Staged file metadata. Reference the returned URL in the Issue Markdown and send the ID in attachment_ids when creating the Issue.
          content:
            application/json:
              schema:
                type: object
                required: [id, url, name, image]
                properties:
                  id: { type: string, pattern: '^[a-f0-9]{32}$' }
                  url: { type: string, format: uri-reference }
                  name: { type: string }
                  image: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issue-attachments/{attachmentID}:
    get:
      operationId: getIssueAttachment
      summary: Read or download an issue attachment
      description: Only the uploader can read a staged file. A published file is available to authenticated organization members who can read the repository.
      security: [{ sessionCookie: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: attachmentID
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: download
          in: query
          description: A non-empty value requests a download for an image or video. Other files always download.
          schema: { type: string }
      responses:
        "200":
          description: File bytes. Images and videos are served with their validated media type. Other files use application/octet-stream.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream: {}
            image/*: {}
            video/*: {}
        "206":
          description: Partial file bytes requested with a valid Range header.
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "416":
          description: Unsatisfiable Range header.
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}:
    get:
      operationId: getIssue
      summary: Get issue by repository and number
      security: [{ sessionCookie: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          description: Issue number within repository
          schema: { type: integer, minimum: 1 }
        - name: repository
          in: query
          required: true
          description: Repository slug (e.g., "owner/repo")
          schema: { type: string }
      responses:
        "200":
          description: Issue details. An old location after transfer returns the issue with its canonical repository and number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateIssue
      summary: Update issue content or replace selected metadata fields
      description: Authors, organization admins, and owners can edit content. Only organization owners and admins can edit metadata. If the update timestamp is stale, the entire write is rejected.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueUpdate" }
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/close:
    post:
      operationId: closeIssue
      summary: Close an issue with a reason
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [completed, not_planned, duplicate]
                  description: Reason for closing the issue
      responses:
        "200":
          description: Issue closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/reopen:
    post:
      operationId: reopenIssue
      summary: Reopen a closed issue
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Issue reopened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/lock:
    post:
      operationId: lockIssue
      summary: Restrict comments and reactions to maintainers
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [off-topic, 'too heated', resolved, spam] }
      responses:
        "200":
          $ref: "#/components/responses/UpdatedIssue"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unlockIssue
      summary: Unlock an issue
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/UpdatedIssue" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ==================== Comments ====================
  /api/v1/organizations/{organizationID}/issues/{number}/comments:
    get:
      operationId: listIssueComments
      summary: List comments for an issue
      security: [{ sessionCookie: [] }]
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of comments (chronological order)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: [array, "null"]
                    items: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIssueComment
      summary: Create a comment on an issue
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/comments/{id}:
    get:
      operationId: getComment
      summary: Get a single comment
      security: [{ sessionCookie: [] }]
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Comment details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateComment
      summary: Update a comment
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 65536
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteComment
      summary: Delete a comment
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Comment deleted
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/comments/{id}/minimize:
    post:
      operationId: minimizeComment
      summary: Minimize (collapse) a comment
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [spam, off-topic, outdated, resolved]
      responses:
        "200":
          description: Comment minimized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unminimizeComment
      summary: Unminimize a comment
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Comment unminimized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ==================== Reactions ====================
  /api/v1/organizations/{organizationID}/comments/{id}/reactions:
    get:
      operationId: listCommentReactions
      summary: List reactions for a comment
      security: [{ sessionCookie: [] }]
      tags: [Reactions]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of reactions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: [array, "null"]
                    items: { $ref: "#/components/schemas/Reaction" }
    post:
      operationId: addCommentReaction
      summary: Add a reaction to a comment
