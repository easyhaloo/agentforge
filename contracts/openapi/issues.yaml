  /api/v1/organizations/{organizationID}/issues/{number}/transfer:
    post:
      operationId: transferIssue
      summary: Move an issue to another repository in the organization
      description: Only owners and administrators can transfer. Private issues cannot move to a public repository. Remove parent and child links first. The issue ID, attachments, subscriptions, conversation and history remain with the issue. Repository labels, milestones, projects and development associations are cleared.
      tags: [Issues]
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: repository, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, expected_updated_at]
              properties:
                repository: { type: string, description: Destination repository slug }
                expected_updated_at: { type: string, format: date-time }
      responses:
        "200":
          description: Transferred issue with the number allocated at the destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/github-source:
    parameters:
      - $ref: "#/components/parameters/organizationID"
      - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: repository, in: query, required: true, schema: { type: string } }
    get:
      operationId: getIssueGitHubSource
      summary: Read the linked public GitHub issue and its stored cross-references
      tags: [Issues]
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/IssueGitHubSource" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setIssueGitHubSource
      summary: Sync or remove the issue's public GitHub source
      description: Owners and administrators can link or refresh a public GitHub issue. A successful sync stores cross-references found on the first page of its timeline. An empty URL unlinks it.
      tags: [Issues]
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 200 }
                expected_fetched_at: { type: string, description: The current fetched_at value or empty if not linked }
      responses:
        "200": { $ref: "#/components/responses/IssueGitHubSource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/branches:
    post:
      operationId: createIssueBranch
      summary: Create a Git branch for an issue
      description: Owners and administrators can create a branch in the issue repository from a pinned base commit. It remains in that repository if the issue is transferred.
      tags: [Issues]
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: repository, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_branch, base_sha]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,79}$', description: Branch suffix }
                base_branch: { type: string, description: Existing branch name without refs/heads/ }
                base_sha: { type: string, pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$' }
      responses:
        "201":
          description: Created Git ref
          content:
            application/json:
              schema:
                type: object
                required: [name, kind, sha]
                properties:
                  name: { type: string }
                  kind: { type: string, const: branch }
                  sha: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

