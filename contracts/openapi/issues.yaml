openapi: 3.1.0
info:
  title: AgentForge Issues API
  version: 1.0.0
  description: GitHub-compatible Issue tracking, Comments, Labels, and Milestones

paths:
  # ==================== Issues ====================
  /api/v1/organizations/{organizationID}/issues:
    get:
      operationId: listIssues
      summary: List issues with filtering and pagination
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: repository
          in: query
          description: Filter by repository slug (e.g., "owner/repo")
          schema: { type: string }
        - name: state
          in: query
          description: Filter by state
          schema: { type: string, enum: [open, closed, all], default: open }
        - name: creator
          in: query
          description: Filter by creator user ID
          schema: { type: string }
        - name: assignee
          in: query
          description: Filter by assignee. Use "none" for unassigned, "*" for any assignee.
          schema: { type: string }
        - name: labels
          in: query
          description: Comma-separated label names (AND logic)
          schema: { type: string }
        - name: milestone
          in: query
          description: Milestone ID, "none" for no milestone, "*" for any milestone
          schema: { type: string }
        - name: since
          in: query
          description: Filter by updated_at >= timestamp
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: Full-text search in title and body
          schema: { type: string }
        - name: sort
          in: query
          description: Sort field
          schema: { type: string, enum: [created, updated, comments], default: updated }
        - name: direction
          in: query
          description: Sort direction
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          description: Page number (1-indexed)
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: Results per page
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIssue
      summary: Create a new issue
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCreate" }
      responses:
        "201":
          description: Issue created successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}:
    get:
      operationId: getIssue
      summary: Get issue by repository and number
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          description: Issue number within repository
          schema: { type: integer, minimum: 1 }
        - name: repository
          in: query
          required: true
          description: Repository slug (e.g., "owner/repo")
          schema: { type: string }
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateIssue
      summary: Update issue title, body, or milestone
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueUpdate" }
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/close:
    post:
      operationId: closeIssue
      summary: Close an issue with a reason
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state_reason]
              properties:
                state_reason:
                  type: string
                  enum: [completed, not_planned, duplicate]
                  description: Reason for closing the issue
      responses:
        "200":
          description: Issue closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/reopen:
    post:
      operationId: reopenIssue
      summary: Reopen a closed issue
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Issue reopened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/lock:
    post:
      operationId: lockIssue
      summary: Lock an issue to prevent further modifications
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Issue locked
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unlockIssue
      summary: Unlock an issue
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Issue unlocked
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ==================== Comments ====================
  /api/v1/organizations/{organizationID}/issues/{number}/comments:
    get:
      operationId: listIssueComments
      summary: List comments for an issue
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of comments (chronological order)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIssueComment
      summary: Create a comment on an issue
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/comments/{id}:
    get:
      operationId: getComment
      summary: Get a single comment
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Comment details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateComment
      summary: Update a comment
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 65536
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteComment
      summary: Delete a comment
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Comment deleted
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/comments/{id}/minimize:
    post:
      operationId: minimizeComment
      summary: Minimize (collapse) a comment
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [spam, off-topic, outdated, resolved]
      responses:
        "200":
          description: Comment minimized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unminimizeComment
      summary: Unminimize a comment
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Comment unminimized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ==================== Reactions ====================
  /api/v1/organizations/{organizationID}/comments/{id}/reactions:
    get:
      operationId: listCommentReactions
      summary: List reactions for a comment
      tags: [Reactions]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of reactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reaction" }
    post:
      operationId: addCommentReaction
      summary: Add a reaction to a comment
      tags: [Reactions]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  enum: ["+1", "-1", laugh, confused, heart, hooray, rocket, eyes]
      responses:
        "201":
          description: Reaction added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reaction" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/comments/{id}/reactions/{reactionId}:
    delete:
      operationId: removeCommentReaction
      summary: Remove a reaction from a comment
      tags: [Reactions]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: reactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Reaction removed
        "404": { $ref: "#/components/responses/Problem" }

  # ==================== Labels ====================
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/labels:
    get:
      operationId: listLabels
      summary: List all labels for a repository
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of labels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
    post:
      operationId: createLabel
      summary: Create a new label
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelCreate" }
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/labels/{name}:
    patch:
      operationId: updateLabel
      summary: Update a label
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                color: { type: string, pattern: "^[0-9a-fA-F]{6}$" }
      responses:
        "200":
          description: Label updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteLabel
      summary: Delete a label
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Label deleted
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/issues/{number}/labels:
    post:
      operationId: addLabelsToIssue
      summary: Add labels to an issue
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "200":
          description: Labels added
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }

  /api/v1/organizations/{organizationID}/issues/{number}/labels/{name}:
    delete:
      operationId: removeLabelFromIssue
      summary: Remove a label from an issue
      tags: [Labels]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Label removed
        "404": { $ref: "#/components/responses/Problem" }

  # ==================== Assignees ====================
  /api/v1/organizations/{organizationID}/issues/{number}/assignees:
    post:
      operationId: addAssignees
      summary: Add assignees to an issue
      tags: [Assignees]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignees]
              properties:
                assignees:
                  type: array
                  items: { type: string }
                  minItems: 1
                  description: Array of user IDs
      responses:
        "200":
          description: Assignees added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    delete:
      operationId: removeAssignees
      summary: Remove assignees from an issue
      tags: [Assignees]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignees]
              properties:
                assignees:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Assignees removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  # ==================== Milestones ====================
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/milestones:
    get:
      operationId: listMilestones
      summary: List milestones for a repository
      tags: [Milestones]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [open, closed, all], default: open }
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
    post:
      operationId: createMilestone
      summary: Create a new milestone
      tags: [Milestones]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneCreate" }
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }

  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/milestones/{id}:
    get:
      operationId: getMilestone
      summary: Get a milestone
      tags: [Milestones]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Milestone details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMilestone
      summary: Update a milestone
      tags: [Milestones]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                due_on: { type: string, format: date-time }
                state: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: Milestone updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
    delete:
      operationId: deleteMilestone
      summary: Delete a milestone
      tags: [Milestones]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Milestone deleted
        "404": { $ref: "#/components/responses/Problem" }

  # ==================== Timeline ====================
  /api/v1/organizations/{organizationID}/issues/{number}/timeline:
    get:
      operationId: getIssueTimeline
      summary: Get timeline events for an issue
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/organizationID"
        - name: number
          in: path
          required: true
          schema: { type: integer }
        - name: repository
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: Maximum events to return
          schema: { type: integer, minimum: 1, maximum: 300, default: 100 }
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueEvent" }

# ==================== Components ====================
components:
  parameters:
    organizationID:
      name: organizationID
      in: path
      required: true
      description: Organization slug or ID
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 Problem response
      content:
        application/json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }

  schemas:
    # ==================== Issue Schemas ====================
    Issue:
      type: object
      required: [id, number, repository, title, body, state, created_by, created_at, updated_at, comments]
      properties:
        id: { type: string }
        number:
          type: integer
          minimum: 1
          description: Sequential number within repository (#1, #2, #3, ...)
        repository:
          type: string
          description: Repository slug (e.g., "owner/repo")
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          maxLength: 65536
          description: Markdown content
        state:
          type: string
          enum: [open, closed]
        state_reason:
          type: string
          enum: [completed, not_planned, duplicate]
          description: Reason for closure (only when state=closed)
        milestone_id:
          type: string
          description: Associated milestone ID
        locked:
          type: boolean
          description: Whether the issue is locked
        comments:
          type: integer
          minimum: 0
          description: Number of comments
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        assignees:
          type: array
          items:
            type: object
            required: [user_id]
            properties:
              user_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        closed_by: { type: string }

    IssueCreate:
      type: object
      required: [repository, title, body]
      properties:
        repository:
          type: string
          description: Repository slug (e.g., "owner/repo")
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          maxLength: 65536
        assignees:
          type: array
          items: { type: string }
          description: User IDs to assign
        labels:
          type: array
          items: { type: string }
          description: Label names to add

    IssueUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          maxLength: 65536
        milestone_id:
          type: string
          description: Set to empty string to clear milestone

    IssuePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        total:
          type: integer
          minimum: 0
          description: Total matching issues
        limit: { type: integer }
        offset: { type: integer }

    # ==================== Comment Schemas ====================
    Comment:
      type: object
      required: [id, resource_type, resource_id, body, author_id, created_at, updated_at]
      properties:
        id: { type: string }
        resource_type:
          type: string
          enum: [issue, changeset]
        resource_id: { type: string }
        body:
          type: string
          minLength: 1
          maxLength: 65536
        author_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time }
        minimized: { type: boolean }
        minimized_reason:
          type: string
          enum: [spam, off-topic, outdated, resolved]
        reactions:
          type: array
          items: { $ref: "#/components/schemas/Reaction" }

    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536

    # ==================== Reaction Schema ====================
    Reaction:
      type: object
      required: [id, content, user_id, created_at]
      properties:
        id: { type: string }
        content:
          type: string
          enum: ["+1", "-1", laugh, confused, heart, hooray, rocket, eyes]
          description: GitHub-compatible emoji
        user_id: { type: string }
        created_at: { type: string, format: date-time }

    # ==================== Label Schema ====================
    Label:
      type: object
      required: [id, name, description, color, created_at]
      properties:
        id: { type: string }
        name:
          type: string
          minLength: 1
          maxLength: 100
        description: { type: string }
        color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"
          description: Hex color without # (e.g., "d73a4a")
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LabelCreate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description: { type: string }
        color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"

    # ==================== Milestone Schema ====================
    Milestone:
      type: object
      required: [id, title, description, state, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date-time }
        state: { type: string, enum: [open, closed] }
        open_issues: { type: integer, minimum: 0 }
        closed_issues: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }

    MilestoneCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date-time }

    # ==================== Event Schema ====================
    IssueEvent:
      type: object
      required: [id, event_type, created_at]
      properties:
        id: { type: string }
        event_type:
          type: string
          enum: [created, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned, renamed, edited, locked, unlocked, linked_changeset, unlinked_changeset, commented, mentioned, referenced]
        actor_id: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
