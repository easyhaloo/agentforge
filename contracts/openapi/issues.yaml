openapi: 3.1.0
info:
  title: Issue Tracking API
  version: 1.0.0
  description: GitHub-compatible issue tracking with labels, milestones, comments, reactions, events, and notifications

paths:
  /api/v1/organizations/{organizationID}/issues:
    get:
      operationId: listIssues
      summary: List issues
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: repository
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: created_by
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Search query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Issue list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueListResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createIssue
      summary: Create a new issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIssueRequest' }
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/organizations/{organizationID}/issues/{number}:
    get:
      operationId: getIssue
      summary: Get issue by number
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Issue details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateIssue
      summary: Update issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIssueRequest' }
      responses:
        '200':
          description: Issue updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/organizations/{organizationID}/issues/{number}/close:
    post:
      operationId: closeIssue
      summary: Close an issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [completed, not_planned, duplicate]
      responses:
        '200':
          description: Issue closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/organizations/{organizationID}/issues/{number}/reopen:
    post:
      operationId: reopenIssue
      summary: Reopen a closed issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Issue reopened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/organizations/{organizationID}/issues/{number}/lock:
    post:
      operationId: lockIssue
      summary: Lock an issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [off-topic, too heated, resolved, spam]
      responses:
        '200':
          description: Issue locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: unlockIssue
      summary: Unlock an issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Issue unlocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/organizations/{organizationID}/issues/{number}/assignees:
    post:
      operationId: addAssignees
      summary: Add assignees to an issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignees]
              properties:
                assignees:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Assignees added
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignees:
                    type: array
                    items: { type: string }
    delete:
      operationId: removeAssignees
      summary: Remove assignees from an issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignees]
              properties:
                assignees:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Assignees removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignees:
                    type: array
                    items: { type: string }

  /api/v1/organizations/{organizationID}/issues/{number}/labels:
    post:
      operationId: addLabelsToIssue
      summary: Add labels to an issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Labels added
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items: { $ref: '#/components/schemas/Label' }

  /api/v1/organizations/{organizationID}/issues/{number}/labels/{labelName}:
    delete:
      operationId: removeLabelFromIssue
      summary: Remove a label from an issue
      tags: [Issues]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: labelName
          in: path
          required: true
          schema: { type: string }
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Label removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items: { $ref: '#/components/schemas/Label' }

  /api/v1/organizations/{organizationID}/issues/{number}/timeline:
    get:
      operationId: getIssueTimeline
      summary: Get issue timeline events
      tags: [Issues, Events]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Timeline events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/organizations/{organizationID}/issues/{number}/subscription:
    get:
      operationId: getIssueSubscription
      summary: Check if user is subscribed to issue
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: subscribeToIssue
      summary: Subscribe to issue notifications
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: unsubscribeFromIssue
      summary: Unsubscribe from issue notifications
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/organizations/{organizationID}/issues/{number}/comments:
    get:
      operationId: listIssueComments
      summary: List comments on an issue
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
    post:
      operationId: createIssueComment
      summary: Create a comment on an issue
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - $ref: '#/components/parameters/issueNumber'
        - name: repository
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 65536 }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }

  /api/v1/organizations/{organizationID}/comments/{commentID}:
    get:
      operationId: getComment
      summary: Get a comment by ID
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comment details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateComment
      summary: Update a comment
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 65536 }
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
    delete:
      operationId: deleteComment
      summary: Delete a comment
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Comment deleted

  /api/v1/organizations/{organizationID}/comments/{commentID}/minimize:
    post:
      operationId: minimizeComment
      summary: Minimize a comment
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [spam, off-topic, outdated, resolved]
      responses:
        '200':
          description: Comment minimized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
    delete:
      operationId: unminimizeComment
      summary: Unminimize a comment
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comment unminimized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }

  /api/v1/organizations/{organizationID}/comments/{commentID}/reactions:
    get:
      operationId: listCommentReactions
      summary: List reactions on a comment
      tags: [Reactions]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reactions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  reactions:
                    type: array
                    items: { $ref: '#/components/schemas/Reaction' }
    post:
      operationId: addCommentReaction
      summary: Add a reaction to a comment
      tags: [Reactions]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  enum: ['+1', '-1', laugh, confused, heart, hooray, rocket, eyes]
      responses:
        '201':
          description: Reaction added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reaction' }

  /api/v1/organizations/{organizationID}/comments/{commentID}/reactions/{reactionID}:
    delete:
      operationId: removeCommentReaction
      summary: Remove a reaction from a comment
      tags: [Reactions]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: commentID
          in: path
          required: true
          schema: { type: string }
        - name: reactionID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Reaction removed

  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/labels:
    get:
      operationId: listLabels
      summary: List labels in a repository
      tags: [Labels]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Labels list
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items: { $ref: '#/components/schemas/Label' }
    post:
      operationId: createLabel
      summary: Create a new label
      tags: [Labels]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLabelRequest' }
      responses:
        '201':
          description: Label created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }

  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/labels/{name}:
    patch:
      operationId: updateLabel
      summary: Update a label
      tags: [Labels]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string }
                color: { type: string, pattern: '^[0-9a-fA-F]{6}$' }
      responses:
        '200':
          description: Label updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
    delete:
      operationId: deleteLabel
      summary: Delete a label
      tags: [Labels]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Label deleted

  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/milestones:
    get:
      operationId: listMilestones
      summary: List milestones in a repository
      tags: [Milestones]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [open, closed] }
      responses:
        '200':
          description: Milestones list
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestones:
                    type: array
                    items: { $ref: '#/components/schemas/Milestone' }
    post:
      operationId: createMilestone
      summary: Create a new milestone
      tags: [Milestones]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMilestoneRequest' }
      responses:
        '201':
          description: Milestone created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }

  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/milestones/{milestoneID}:
    get:
      operationId: getMilestone
      summary: Get a milestone by ID
      tags: [Milestones]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: milestoneID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Milestone details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMilestone
      summary: Update a milestone
      tags: [Milestones]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: milestoneID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                due_on: { type: string, format: date-time }
                state: { type: string, enum: [open, closed] }
      responses:
        '200':
          description: Milestone updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
    delete:
      operationId: deleteMilestone
      summary: Delete a milestone
      tags: [Milestones]
      parameters:
        - $ref: '#/components/parameters/organizationID'
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: milestoneID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Milestone deleted

  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List user's notifications
      tags: [Notifications]
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
          description: Filter to only unread notifications
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationAsRead
      summary: Mark a notification as read
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsAsRead
      summary: Mark all notifications as read
      tags: [Notifications]
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

components:
  parameters:
    organizationID:
      name: organizationID
      in: path
      required: true
      schema: { type: string }
    issueNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Problem:
      description: RFC 7807 Problem Details
      content:
        application/json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }

  schemas:
    Issue:
      type: object
      required: [id, repository, number, title, body, state, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        repository: { type: string }
        number: { type: integer }
        title: { type: string, maxLength: 500 }
        body: { type: string }
        state: { type: string, enum: [open, closed] }
        state_reason: { type: string, enum: [completed, not_planned, duplicate], nullable: true }
        milestone_id: { type: string, nullable: true }
        locked: { type: boolean }
        lock_reason: { type: string, enum: [off-topic, too heated, resolved, spam], nullable: true }
        comments_count: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        closed_by: { type: string, nullable: true }

    CreateIssueRequest:
      type: object
      required: [repository, title]
      properties:
        repository: { type: string }
        title: { type: string, maxLength: 500 }
        body: { type: string }

    UpdateIssueRequest:
      type: object
      properties:
        title: { type: string, maxLength: 500 }
        body: { type: string }

    IssueListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    Comment:
      type: object
      required: [id, resource_type, resource_id, body, author_id, created_at, updated_at]
      properties:
        id: { type: string }
        resource_type: { type: string, enum: [issue, changeset] }
        resource_id: { type: string }
        body: { type: string, maxLength: 65536 }
        author_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        minimized: { type: boolean }
        minimized_reason: { type: string, enum: [spam, off-topic, outdated, resolved], nullable: true }

    Label:
      type: object
      required: [id, repository, name, description, color, created_at, updated_at]
      properties:
        id: { type: string }
        repository: { type: string }
        name: { type: string, maxLength: 100 }
        description: { type: string }
        color: { type: string, pattern: '^[0-9a-fA-F]{6}$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string }
        color: { type: string, pattern: '^[0-9a-fA-F]{6}$' }

    Milestone:
      type: object
      required: [id, repository, title, description, state, created_at, updated_at]
      properties:
        id: { type: string }
        repository: { type: string }
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [open, closed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    CreateMilestoneRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date-time }

    Reaction:
      type: object
      required: [id, reactable_type, reactable_id, user_id, content, created_at]
      properties:
        id: { type: string }
        reactable_type: { type: string, enum: [issue, comment] }
        reactable_id: { type: string }
        user_id: { type: string }
        content: { type: string, enum: ['+1', '-1', laugh, confused, heart, hooray, rocket, eyes] }
        created_at: { type: string, format: date-time }

    Event:
      type: object
      required: [id, issue_id, event_type, created_at]
      properties:
        id: { type: string }
        issue_id: { type: string }
        event_type:
          type: string
          enum:
            - created
            - closed
            - reopened
            - labeled
            - unlabeled
            - assigned
            - unassigned
            - milestoned
            - demilestoned
            - renamed
            - edited
            - locked
            - unlocked
            - linked_changeset
            - unlinked_changeset
            - commented
            - mentioned
            - referenced
        actor_id: { type: string, nullable: true }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, user_id, type, reason, issue_id, repository, issue_number, issue_title, unread, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [comment, mention, state_change, assigned] }
        reason: { type: string, enum: [subscribed, mentioned, author, assigned, comment] }
        issue_id: { type: string }
        repository: { type: string }
        issue_number: { type: integer }
        issue_title: { type: string }
        comment_id: { type: string, nullable: true }
        actor_id: { type: string, nullable: true }
        unread: { type: boolean }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }

    NotificationListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
