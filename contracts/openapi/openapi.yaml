    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1versions"
  /healthz:
    get:
      operationId: getHealth
      summary: Report API process health
      security: []
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadiness
      summary: Report API, storage, and identity readiness
      security: []
      responses:
        "200":
          description: API, database, and identity dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A required database or identity dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/providers:
    get:
      operationId: listSSOProviders
      summary: List the SSO providers available to this deployment
      security: []
      responses:
        "200":
          description: Available providers in display order, or an empty list
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, login_url]
                      properties:
                        id: { type: string, enum: [google, github, oidc] }
                        login_url: { type: string, enum: [/auth/google/login, /auth/github/login, /auth/oidc/login] }
  /auth/{provider}/login:
    get:
      operationId: startProviderLogin
      summary: Start Google or GitHub sign-in with PKCE
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, github] }
        - in: query
          name: return
          schema: { type: string }
          description: Optional same-origin absolute path after sign-in
      responses:
        "302":
          description: Redirect to the provider
        "303":
          description: Redirect back to login on initialization failure
        "503": { $ref: "#/components/responses/Problem" }
  /auth/{provider}/callback:
    get:
      operationId: completeProviderLogin
      summary: Verify the Google or GitHub identity and establish a session
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, github] }
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the application on success or to login with a fixed sso_error code on failure
        "503": { $ref: "#/components/responses/Problem" }
  /auth/oidc/login:
    get:
      operationId: startOIDCLogin
      summary: Start OIDC Authorization Code flow with PKCE
      security: []
      responses:
        "302":
          description: Redirect to the configured OpenID Provider
        "503": { $ref: "#/components/responses/Problem" }
  /auth/invitations/accept:
    get:
      operationId: beginOrganizationInvitationAcceptance
      summary: Bind a one-time invitation token to the browser and begin SSO login
      description: The SSO callback consumes the invitation after verifying that the provider email matches the invited address.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, minLength: 40, maxLength: 128 }
      responses:
        "303":
          description: Redirect to the SSO provider chooser or directly to the generic OIDC login route
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/oidc/callback:
    get:
      operationId: completeOIDCLogin
      summary: Validate OIDC response and establish an application session
      security: []
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the configured application origin after session creation
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/me:
    get:
      operationId: getCurrentAccount
      summary: Get the authenticated account and its active organizations
      description: Returns only organizations where the current session user has an active membership and the organization is active. No user or organization identifier is accepted from the client.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Authenticated account context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountContext" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current application session
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204":
          description: Session revoked and authentication cookies cleared
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/members:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationMembers
      summary: List members in the selected organization
      description: Restricted to active organization owners and administrators
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Organization member page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMemberPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/members/{userID}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: userID
        required: true
        schema: { type: string }
    patch:
      operationId: updateOrganizationMember
      summary: Change a member role or active/suspended status
      description: Owners can manage all roles. Administrators can manage members and viewers but cannot grant administrative or owner privileges or modify another administrator. The last active owner cannot be demoted or suspended.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationMember" }
      responses:
        "200":
          description: Updated organization membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeOrganizationMember
      summary: Remove a member from the organization
      description: Removal is soft-deleted and audited. The last active owner cannot be removed.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Membership removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/invitations:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationInvitations
      summary: List organization invitations
      description: Restricted to active organization owners and administrators. Token values are never returned.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Invitation page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrganizationInvitation
      summary: Create a seven-day, single-use organization invitation
      description: The raw token and invitation URL are returned only once. Only verified OIDC email claims can redeem the token. Administrators may invite members and viewers, while owners may also invite administrators.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationInvitation" }
      responses:
        "201":
          description: Invitation created; protect the returned URL as a secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedOrganizationInvitation" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/invitations/{invitationID}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: invitationID
        required: true
        schema: { type: string }
    delete:
      operationId: revokeOrganizationInvitation
      summary: Revoke a pending invitation
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Invitation revoked }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/membership-audit:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationMembershipAudit
      summary: Read organization membership audit history
      description: Restricted to active organization owners and administrators. Events are returned newest first.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Membership audit page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipAuditPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/repositories:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationRepositories
      summary: List registered organization repositories
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Organization repository catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RepositoryMetadata" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: registerOrganizationRepository
      summary: Create or register a repository under the trusted Git root
      description: Owners and administrators only. Provide initialize to create a private repository. The default is main or the selected template’s default branch. Otherwise the API validates the existing default branch before persisting metadata.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, default_branch]
              properties:
                slug: { type: string, pattern: "^[^/]+/[^/]+$" }
                default_branch: { type: string, minLength: 1 }
                description: { type: string, maxLength: 350 }
                initialize:
                  type: object
                  properties:
                    template: { type: string, description: Enabled native Git template slug in the same organization. Cannot be combined with starter files. }
                    include_all_branches: { type: boolean, default: false, description: Copy each template branch as an independent root commit. Requires a template. }
                    readme: { type: boolean, default: false }
                    gitignore: { type: string, enum: ["", node, python, go] }
                    license: { type: string, enum: ["", mit] }
                visibility:
                  type: string
                  enum: ["", public, private]
                  description: Display-only visibility. With initialize omitted, an empty or omitted value means unknown.
                fork:
                  type: boolean
                  default: false
                  description: Display-only fork indicator for an existing repository.
      responses:
        "201":
          description: Registered repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryMetadata" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/settings:
    parameters:
      - { in: path, name: organizationID, required: true, schema: { type: string } }
      - { in: path, name: owner, required: true, schema: { type: string } }
      - { in: path, name: repo, required: true, schema: { type: string } }
    get:
      operationId: getRepositorySettings
      summary: Read repository settings from the catalog
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Repository settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositorySettings" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateRepositorySettings
      summary: Update general repository settings or the default branch
      description: Owners and administrators only. Branch changes update the default branch for registered and hosted repositories. Hosted Git updates its clone HEAD and protects the new default branch from direct pushes. General settings require the updated_at value returned by the settings or refs endpoint. Omitted fields are preserved and at least one pull request merge method must remain enabled.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [default_branch, previous_branch]
                  properties:
                    default_branch: { type: string }
                    previous_branch: { type: string }
                - type: object
                  additionalProperties: false
                  required: [updated_at]
                  minProperties: 2
                  properties:
                    updated_at: { type: string, format: date-time }
                    description: { type: string, maxLength: 350 }
                    is_template: { type: boolean, description: Only native Git repositories can be enabled as templates. }
                    web_commit_signoff_required: { type: boolean, description: Require explicit Developer Certificate of Origin sign-off for WebIDE commits. }
                    delete_merged_branches: { type: boolean, description: Delete eligible source branches after merging pull requests in native Git repositories. }
                    allow_merge_commit: { type: boolean }
                    allow_squash_merge: { type: boolean }
                    allow_rebase_merge: { type: boolean }
                    issues_disabled: { type: boolean, description: Hides existing repository issues and blocks new ones until enabled. }
                    actions_disabled: { type: boolean, description: Blocks new workflow runs for this repository. }
                    protected_refs: { $ref: "#/components/schemas/RepositoryProtectedRefs" }
                    ref_rules: { $ref: "#/components/schemas/RepositoryRefRules" }
                    push_ref_limit:
                      description: Optional branch and tag update cap for native Git pushes. Zero uses the server maximum of 128.
                      oneOf:
                        - { type: integer, enum: [0] }
                        - { type: integer, minimum: 2, maximum: 128 }
      responses:
        "200":
          description: Updated general repository settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositorySettings" }
        "204": { description: Updated default branch }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/refs:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
    get:
      operationId: listRepositoryRefs
      summary: List repository branches and tags
      description: Requires active organization membership and a registered repository. Ref names are selectors; content reads resolve them to immutable commit SHAs. Results are bounded to 1000 refs.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Repository branches and tags
          content:
            application/json:
              schema:
                type: object
                required: [repository, default_branch, resolved_commit_sha, items, hosting_kind, git_credentials_available, description, is_template, delete_merged_branches, allow_merge_commit, allow_squash_merge, allow_rebase_merge, web_commit_signoff_required, issues_disabled, push_ref_limit, updated_at]
                properties:
                  repository: { type: string }
                  default_branch: { type: string }
                  hosting_kind: { type: string, enum: [hosted, registered] }
                  git_credentials_available: { type: boolean }
                  delete_merged_branches: { type: boolean }
                  allow_merge_commit: { type: boolean, default: true }
                  allow_squash_merge: { type: boolean, default: true }
                  allow_rebase_merge: { type: boolean, default: true }
                  web_commit_signoff_required: { type: boolean }
                  issues_disabled: { type: boolean }
                  description: { type: string }
                  is_template: { type: boolean }
                  protected_refs: { $ref: "#/components/schemas/RepositoryProtectedRefs" }
                  push_ref_limit: { type: integer, minimum: 0, maximum: 128 }
                  updated_at: { type: string, format: date-time }
                  resolved_commit_sha: { type: string, pattern: "^([0-9a-f]{40}|[0-9a-f]{64})?$", description: Empty before the default branch has a commit }
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      required: [name, kind, sha]
                      properties:
                        name: { type: string }
                        kind: { type: string, enum: [branch, tag] }
                        sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/tree:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit; omitted uses the registered default branch. The response always returns an immutable commit SHA.
        schema: { type: string }
      - in: query
        name: path
        description: Repository-relative directory path; empty selects the repository root.
        schema: { type: string, maxLength: 1024 }
    get:
      operationId: listRepositoryTree
      summary: List a repository directory at an immutable Git commit
      description: Requires active organization membership and a registered repository. Resolves ref once and returns entries pinned to the resulting full commit SHA. Directory results are bounded to 2000 entries.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit-pinned directory listing
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, path, items]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  path: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, path, kind, mode, sha]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        kind: { type: string }
                        mode: { type: string }
                        sha: { type: string }
                        size: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/git-credentials:
    parameters:
      - { in: path, name: organizationID, required: true, schema: { type: string } }
      - { in: path, name: owner, required: true, schema: { type: string } }
      - { in: path, name: repo, required: true, schema: { type: string } }
    get:
      operationId: listGitCredentials
      summary: List the signed-in user's active Smart HTTP credentials for this repository
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Active credential metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, scope, expires_at]
                      properties:
                        id: { type: string, format: uuid }
                        scope: { type: string, enum: [read, write] }
                        expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createGitCredential
      summary: Issue a repository-scoped Smart HTTP credential valid for one hour
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [read, write] }
      responses:
        "201":
          description: Credential with one-time plaintext token
          content:
            application/json:
              schema:
                type: object
                required: [id, username, token, expires_at]
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string, const: git }
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/git-credentials/{credentialID}:
    parameters:
      - { in: path, name: organizationID, required: true, schema: { type: string } }
      - { in: path, name: owner, required: true, schema: { type: string } }
      - { in: path, name: repo, required: true, schema: { type: string } }
      - { in: path, name: credentialID, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeGitCredential
      summary: Revoke a Git credential issued to the signed-in user
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Credential revoked or already unavailable to the caller }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/commit-issues:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag, or commit resolved to an immutable commit SHA.
        schema: { type: string }
    get:
      operationId: listCommitIssues
      summary: List the same-repository issues linked to a Git commit
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Linked Issue numbers, up to 100 per commit
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/history:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit; resolved once to an immutable commit SHA.
        schema: { type: string }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    get:
      operationId: listRepositoryHistory
      summary: List commits reachable from a pinned repository revision
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit history
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, items]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [sha, parents, author, authored_at, subject]
                      properties:
                        sha: { type: string }
                        parents: { type: array, items: { type: string } }
                        author: { type: string }
                        authored_at: { type: string, format: date-time }
                        subject: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/compare:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: base
        required: true
        description: Base branch, tag or commit. Supply an explicit empty value to compare the head against the empty tree.
        allowEmptyValue: true
        schema: { type: string, maxLength: 256 }
      - in: query
        name: head
        required: true
        description: Head branch, tag or commit, resolved to an immutable commit SHA.
        schema: { type: string, minLength: 1, maxLength: 256 }
      - in: query
        name: mode
        required: false
        description: Compare from the common ancestor of base and head, as in a pull request. Requires a nonempty base.
        schema: { type: string, enum: [merge-base] }
    get:
      operationId: compareRepositoryCommits
      summary: Compare two immutable repository commits
      description: Requires active organization membership and a registered repository. Nonempty refs are resolved server-side before a bounded, non-renamed, non-external diff is generated. Output is limited to 1 MiB.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit comparison patch
          content:
            application/json:
              schema:
                type: object
                required: [repository, base_sha, head_sha, patch]
                properties:
                  repository: { type: string }
                  base_sha: { type: string, pattern: "^([0-9a-f]{40}|[0-9a-f]{64})?$", description: Empty when comparing against the empty tree. }
                  head_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  patch: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/file-history:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit resolved to an immutable SHA.
        schema: { type: string }
      - in: query
        name: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 1024 }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    get:
      operationId: listRepositoryFileHistory
      summary: List history for a file at a pinned commit
      description: Requires active organization membership and repository registration. The ref is resolved server-side and Git history is bounded to 100 commits and 1 MiB output.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: File commit history
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, path, items]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  path: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/RepositoryCommit" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/blame:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit resolved to an immutable SHA.
        schema: { type: string }
      - in: query
        name: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 1024 }
      - in: query
        name: start
        schema: { type: integer, minimum: 1, default: 1 }
      - in: query
        name: end
        schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
    get:
      operationId: blameRepositoryFile
      summary: Attribute file lines to immutable commits
      description: Requires active organization membership and repository registration. At most 500 lines and 1 MiB of Git blame output are returned for the pinned commit.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: File blame lines
          content:
            application/json:
              schema:
                type: object
