openapi: 3.1.0
info:
  title: AgentForge API
  version: 0.8.0
  description: Persistent delivery lifecycle, organization membership, and GitHub-compatible Issue tracking API. Browser writes require a same-origin configured application origin, a session-bound CSRF token, and a trusted authenticated identity provider. Every `/organizations/{organizationID}` path accepts the organization slug or id.
servers:
  - url: /
paths:
  /api/v1/users/me/saved-replies:
    get:
      operationId: listSavedReplies
      summary: List the current user's saved replies, newest first
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Personal replies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SavedReply" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSavedReply
      summary: Save a personal Markdown reply
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        $ref: "#/components/requestBodies/SavedReplyInput"
      responses:
        "201": { $ref: "#/components/responses/SavedReply" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/users/me/saved-replies/{replyID}:
    parameters:
      - name: replyID
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateSavedReply
      summary: Replace the title and body of a personal saved reply
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        $ref: "#/components/requestBodies/SavedReplyInput"
      responses:
        "200": { $ref: "#/components/responses/SavedReply" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSavedReply
      summary: Delete a personal saved reply
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Reply deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/notifications:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: listPersonalNotifications
      summary: List the signed-in member's notifications in this organization
      security: [{ sessionCookie: [] }]
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: unread
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, user_id, type, reason, issue_id, repository, issue_number, issue_title, unread, created_at]
                      properties:
                        id: { type: string }
                        user_id: { type: string }
                        type: { type: string, enum: [comment, mention, state_change, assigned] }
                        reason: { type: string, enum: [subscribed, mentioned, author, assigned, comment] }
                        issue_id: { type: string }
                        repository: { type: string }
                        issue_number: { type: integer, minimum: 1 }
                        issue_title: { type: string }
                        comment_id: { type: string }
                        actor_id: { type: string }
                        unread: { type: boolean }
                        created_at: { type: string, format: date-time }
                        read_at: { type: string, format: date-time }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: markPersonalNotificationRead
      summary: Mark the signed-in member's notification as read
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "200":
          description: Notification was marked as read
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  # ==================== Issues ====================
