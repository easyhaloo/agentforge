openapi: 3.1.0
info:
  title: AgentForge API
  version: 0.1.0
  description: Initial HTTP contract for the AgentForge API.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report API process health
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report API readiness
      responses:
        "200":
          description: API is ready to receive requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
