        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      operationId: changePullRequestState
      summary: Change pull request state
      description: Transitions the pull request state. Only the author, owner or admin can transition. Actions are ready (mark as ready), draft (mark as draft), close (close the PR), reopen (reopen a closed PR). Merged PRs cannot be closed or reopened.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [ready, draft, close, reopen] }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/pull-request/title:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      operationId: changePullRequestTitle
      summary: Change pull request title
      description: The author with organization write access, an organization owner, or an admin can change the title in any pull request state. The changeset ID and revision-bound delivery state are preserved. A title equal to the current title after trimming leaves the version and audit trail unchanged. A stale version returns 409 even if the title matches.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, version]
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  description: Leading and trailing whitespace is trimmed. The resulting title must contain 1 to 200 Unicode code points and no NUL character.
                version:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Version of the stored changeset being edited.
      responses:
        "200":
          description: Stored changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
