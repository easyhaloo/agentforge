    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines"
  /api/v1/organizations/{organizationID}/pipelines/{id}:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}"
  /api/v1/organizations/{organizationID}/pipelines/{id}/draft:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1draft"
