  /api/v1/organizations/{organizationID}/changesets:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listChangesets
      summary: List persisted changesets
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: repository
          description: Exact repository match.
          schema: { type: string }
        - in: query
          name: status
          description: Server-derived lifecycle status of the changeset.
          schema:
            type: string
            enum: [draft, evaluation_pending, evaluation_failed, evidence_required, review_required, in_review, changes_requested, ready_to_merge, merged]
        - in: query
          name: reviewer
          description: A user id, or the literal `me` for the authenticated user. Matches changesets whose current revision has a review assigned to that user, whatever its decision, except a review superseded by a newer assignment (status stale), which never matches. Reviews of older revisions do not count. Combine with status=in_review for a pending review queue.
          schema: { type: string }
        - in: query
          name: q
          description: Case-insensitive substring match over id, title, repository and created_by.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: state
          description: Filter pull requests by open/closed status. "open" matches PRs where closed is false. "closed" matches PRs where closed is true (includes merged PRs). Non-PR changesets are always included regardless of this filter.
          schema: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: Changeset page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesetPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createChangeset
      summary: Create a changeset
