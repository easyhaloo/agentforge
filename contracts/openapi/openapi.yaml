  /api/v1/organizations/{organizationID}/pipeline-runs/{run}/objects/{object}:
    $ref: ./pipeline-objects.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipeline-runs~1{run}~1objects~1{object}
