openapi: 3.1.0
info:
  title: AgentForge API
  version: 0.4.0
  description: Persistent delivery lifecycle and organization membership API. Browser writes require a same-origin configured application origin, a session-bound CSRF token, and a trusted authenticated identity provider.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report API process health
      security: []
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadiness
      summary: Report API, storage, and identity readiness
      security: []
      responses:
        "200":
          description: API, database, and identity dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A required database or identity dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/oidc/login:
    get:
      operationId: startOIDCLogin
      summary: Start OIDC Authorization Code flow with PKCE
      security: []
      responses:
        "302":
          description: Redirect to the configured OpenID Provider
        "503": { $ref: "#/components/responses/Problem" }
  /auth/oidc/callback:
    get:
      operationId: completeOIDCLogin
      summary: Validate OIDC response and establish an application session
      security: []
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the configured application origin after session creation
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current application session
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204":
          description: Session revoked and authentication cookies cleared
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/members:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationMembers
      summary: List members in the selected organization
      description: Restricted to active organization owners and administrators
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Organization member page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMemberPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/members/{userID}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: userID
        required: true
        schema: { type: string }
    patch:
      operationId: updateOrganizationMember
      summary: Change a member role or active/suspended status
      description: Owners can manage all roles. Administrators can manage members and viewers but cannot grant administrative or owner privileges or modify another administrator. The last active owner cannot be demoted or suspended.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationMember" }
      responses:
        "200":
          description: Updated organization membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeOrganizationMember
      summary: Remove a member from the organization
      description: Removal is soft-deleted and audited. The last active owner cannot be removed.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Membership removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listChangesets
      summary: List persisted changesets
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Changeset page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesetPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createChangeset
      summary: Create a changeset
      description: Actor identity is resolved by trusted server authentication; client-supplied actor fields are rejected.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChangeset" }
      responses:
        "201":
          description: Changeset created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getChangeset
      summary: Get a changeset and its lifecycle history
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Persisted changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/revisions:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: addRevision
      summary: Add a revision and stale prior evidence and reviews
      description: Returns 501 until a Git provider adapter validates the repository revision
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref: { type: string, minLength: 1 }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/evaluations:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: recordEvaluation
      summary: Record an evaluation result for the current revision
      description: Returns 501 until a trusted evaluation worker is configured; clients cannot assert evaluation outcomes
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id, status]
              properties:
                revision_id: { type: string }
                status: { type: string, enum: [passed, failed] }
                summary: { type: string }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/evidence:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: attachEvidence
      summary: Attach evidence from a passed evaluation on the current revision
      description: Returns 501 until a trusted evidence adapter validates artifact provenance
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id, evaluation_id, kind, uri]
              properties:
                revision_id: { type: string }
                evaluation_id: { type: string }
                kind: { type: string }
                uri: { type: string, format: uri }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/reviews:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: submitReview
      summary: Submit a review for a revision with active evidence
      description: Returns 501 until the review assignment and authorization workflow is configured
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                revision_id: { type: string }
                comment: { type: string }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/reviews/{reviewID}/decision:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: decideReview
      summary: Approve or reject a pending review assigned to the authenticated reviewer
      description: Returns 501 until the review authorization workflow is configured
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: reviewID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                comment: { type: string }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agentforge_session
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Host-agentforge_csrf
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    OrganizationMember:
      type: object
      required: [user_id, display_name, role, status, created_at, updated_at]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, invited, suspended] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationMemberPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationMember" }
        limit: { type: integer }
        offset: { type: integer }
    UpdateOrganizationMember:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, suspended] }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
    CreateChangeset:
      type: object
      required: [repository, title]
      additionalProperties: false
      properties:
        repository: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
    StoredChangeset:
      type: object
      required: [changeset, version, created_at, updated_at]
      properties:
        changeset: { type: object }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChangesetPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StoredChangeset" }
        limit: { type: integer }
        offset: { type: integer }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
