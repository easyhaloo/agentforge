      summary: List saved workspace additions and modifications against the pinned base commit
      description: Returns bounded file metadata only. File contents and unified patches are not included. Deletions are not yet supported.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Workspace diff metadata
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, base_commit_sha, items, total]
                properties:
                  workspace_id: { type: string }
                  base_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  total: { type: integer, minimum: 0, maximum: 2000 }
                  items:
                    type: array
                    maxItems: 2000
                    items:
                      type: object
                      required: [path, status, workspace_sha256, version]
                      properties:
                        path: { type: string }
                        status: { type: string, enum: [added, modified] }
                        base_blob_sha: { type: string }
                        workspace_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                        version: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/workspaces/{workspaceID}/changesets:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: workspaceID
        required: true
        schema: { type: string }
    post:
      operationId: createWorkspaceChangeset
      summary: Materialize the saved workspace overlay as an immutable Git revision and create a Changeset
      description: Creates a commit whose sole parent is the workspace's pinned base commit, stores it under an immutable AgentForge ref, and attaches it to the existing Changeset lifecycle. The user target branch is not moved. The saved overlay is read from one bounded repeatable-read database snapshot; at most 2,000 files and 32 MiB are accepted.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                signoff: { type: boolean, description: Explicit DCO consent. Must be true when web commit sign-off is required. }
      responses:
        "201":
          description: Changeset and immutable workspace revision created
          content:
            application/json:
              schema:
                type: object
                required: [changeset, workspace_id, base_commit_sha, revision_commit_sha]
                properties:
                  changeset: { $ref: "#/components/schemas/StoredChangeset" }
                  workspace_id: { type: string }
                  base_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  revision_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/workspaces/{workspaceID}/files:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: workspaceID
        required: true
        schema: { type: string }
    get:
      operationId: readWorkspaceFile
      summary: Read a file from the workspace overlay or pinned base commit
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "200":
          description: File content and optimistic version; zero denotes the immutable base file
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, path, content, sha256, version, source]
                properties:
                  workspace_id: { type: string }
                  path: { type: string }
                  content: { type: string }
                  sha256: { type: string }
                  version: { type: integer, minimum: 0 }
                  source: { type: string, enum: [base, workspace] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
    put:
      operationId: writeWorkspaceFile
      summary: Create or update a workspace file using optimistic version control
      description: Content is limited to 2 MiB. expected_version must match the current workspace overlay version; zero creates the overlay.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content, expected_version]
              additionalProperties: false
              properties:
                path: { type: string, minLength: 1, maxLength: 1024 }
                content: { type: string, maxLength: 2097152 }
                expected_version: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Persisted workspace file and new version
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, path, content, sha256, version, source]
                properties:
                  workspace_id: { type: string }
                  path: { type: string }
                  content: { type: string }
                  sha256: { type: string }
                  version: { type: integer, minimum: 1 }
                  source: { type: string, const: workspace }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }



components:
  parameters:
    OrganizationID:
      name: organizationID
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    webhookSignature:
      $ref: ./pipelines.yaml#/components/securitySchemes/webhookSignature
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agentforge_session
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Host-agentforge_csrf
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  requestBodies:
    SavedReplyInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SavedReplyInput" }
  responses:
    SavedReply:
      description: The persisted personal reply
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SavedReply" }
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    SavedReplyInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          description: Non-blank title with at most 100 Unicode code points after trimming.
        body:
          type: string
          description: Non-blank Markdown, preserved verbatim, with at most 16384 UTF-16 code units.
    SavedReply:
      allOf:
        - $ref: "#/components/schemas/SavedReplyInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    OrganizationMember:
      type: object
      required: [user_id, display_name, role, status, created_at, updated_at]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, invited, suspended] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationMemberPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationMember" }
        limit: { type: integer }
        offset: { type: integer }
    UpdateOrganizationMember:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, suspended] }
    CreateOrganizationInvitation:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { type: string, enum: [admin, member, viewer] }
    CreatedOrganizationInvitation:
      type: object
      required: [invitation, invitation_url, token]
      properties:
        invitation: { $ref: "#/components/schemas/OrganizationInvitation" }
        invitation_url: { type: string, format: uri }
        token: { type: string, minLength: 40, maxLength: 128 }
    OrganizationInvitation:
      type: object
      required: [id, email, role, status, invited_by, expires_at, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member, viewer] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invited_by: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    OrganizationInvitationPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationInvitation" }
        limit: { type: integer }
        offset: { type: integer }
    MembershipAuditEvent:
      type: object
      required: [id, actor_user_id, target_user_id, action, before_role, before_status, after_status, created_at]
      properties:
        id: { type: string }
        actor_user_id: { type: string }
        target_user_id: { type: string }
        action: { type: string, enum: [role_changed, suspended, reactivated, removed, invite_accepted] }
        before_role: { type: string }
        after_role: { type: [string, "null"] }
        before_status: { type: string }
        after_status: { type: string }
        created_at: { type: string, format: date-time }
    MembershipAuditPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MembershipAuditEvent" }
        limit: { type: integer }
        offset: { type: integer }
    OrganizationSummary:
      type: object
      required: [id, slug, name, role]
      properties:
        id: { type: string }
        slug:
          type: string
          description: Organization handle, usable in place of the organization id in any `/organizations/{organizationID}` path. Stored slugs are unique and match `^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$`; `current` is reserved and never assigned. An organization created without a slug (for example by direct SQL) reports its id, which may not match that pattern.
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        personal: { type: boolean, description: Whether this is the account’s personal workspace. }
    AccountContext:
      type: object
      required: [user_id, display_name, organizations]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        email: { type: string }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrganizationSummary" }
    RepositoryProtectedRefs:
      type: array
      description: Native Git branch and tag patterns blocked for direct pushes. Glob wildcards do not span slash separators.
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        pattern: '^refs/(heads|tags)/.+$'
        maxLength: 139
    RepositoryRefRules:
      type: array
      description: Rulesets for writes to a native Git repository. Every matching enabled rule applies. Exclusions take precedence within a ruleset. Each ruleset requires at least one restriction and allows at most 10 patterns across include and exclude. The serialized ruleset list is limited to 64 KiB.
      maxItems: 10
      items:
        type: object
        additionalProperties: false
        required: [name, target, enabled, include]
        properties:
          name: { type: string, minLength: 1, maxLength: 80 }
          target: { type: string, enum: [branch, tag] }
          enabled: { type: boolean }
          include:
            allOf: [{ $ref: "#/components/schemas/RepositoryRefRulePatterns" }, { minItems: 1 }]
          exclude: { $ref: "#/components/schemas/RepositoryRefRulePatterns" }
          restrict_creation: { type: boolean }
          restrict_update: { type: boolean, description: "Blocks direct updates and, for branches, Changeset merges and integration promotions." }
          restrict_deletion: { type: boolean }
          block_force_push: { type: boolean, description: Prevents non-fast-forward branch updates and forced tag replacements. }
          require_pull_request:
            type: boolean
            default: false
            description: >-
              Valid only for branch rulesets. Blocks direct updates to existing branches and requires a verified linked AgentForge pull request for Changeset merges.
              Integration promotion requires each candidate source branch and commit to match a current, verified pull request into the target.
          require_merge_queue:
            type: boolean
            default: false
            description: >-
              Valid only for branch rulesets targeting ~DEFAULT_BRANCH with no exclusions.
              Requires a verified pull request for each source and a successful run at the head of the repository merge queue.
              Blocks native pushes and other writers from directly updating the existing default branch.
          merge_queue_method:
            type: string
            enum: [merge, squash, rebase]
            description: Queue merge method. Requires require_merge_queue. If omitted, the queue creates merge commits or uses fast-forward only under a linear history rule. Merge commits are incompatible with linear history.
          require_linear_history:
            type: boolean
            default: false
            description: Valid only for branch rulesets. Rejects introduced merge commits on pushes and integration promotions. Direct Changeset merges to matching branches must fast-forward without introducing merge commits.
          name_patterns:
            type: array
            maxItems: 10
            description: Every listed restriction applies to the short name of a matching branch or tag on creation or update. Deletion does not evaluate the name.
            items:
              type: object
              additionalProperties: false
              required: [operator, pattern]
              properties:
                operator: { type: string, enum: [starts_with, ends_with, contains, regex] }
                pattern: { type: string, minLength: 1, maxLength: 1024, description: Literal text or an RE2 expression. Limited to 1024 bytes. }
                negate: { type: boolean, default: false }
                name: { type: string, maxLength: 80, description: Optional description of this restriction. }
    RepositoryRefRulePatterns:
      type: array
      description: Ref names or globs without the refs/heads/ or refs/tags/ prefix. Use ~ALL for every ref or ~DEFAULT_BRANCH for the current default branch.
      maxItems: 10
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 128 }
    RepositorySettings:
      allOf:
        - $ref: "#/components/schemas/RepositoryMetadata"
        - type: object
          required: [hosting_kind]
          properties:
            hosting_kind: { type: string, enum: [hosted, registered] }
    RepositoryMetadata:
      type: object
      required: [organization_id, slug, default_branch, fork, is_template, actions_disabled, delete_merged_branches, allow_merge_commit, allow_squash_merge, allow_rebase_merge, web_commit_signoff_required, issues_disabled, push_ref_limit, created_by, created_at, updated_at]
      properties:
        is_template: { type: boolean }
        actions_disabled: { type: boolean }
        delete_merged_branches: { type: boolean }
        allow_merge_commit: { type: boolean, default: true }
        allow_squash_merge: { type: boolean, default: true }
        allow_rebase_merge: { type: boolean, default: true }
        web_commit_signoff_required: { type: boolean }
        issues_disabled: { type: boolean }
        protected_refs: { $ref: "#/components/schemas/RepositoryProtectedRefs" }
        ref_rules: { $ref: "#/components/schemas/RepositoryRefRules" }
        push_ref_limit: { type: integer, minimum: 0, maximum: 128 }
        organization_id: { type: string }
        slug: { type: string }
        default_branch: { type: string }
        description: { type: string, maxLength: 350 }
        visibility:
          type: string
          enum: [public, private]
          description: Display-only visibility. Omitted when unknown.
        fork:
          type: boolean
          description: Display-only fork indicator.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Workspace:
      type: object
      required: [id, organization_id, repository, owner_id, base_commit_sha, base_ref, status, expires_at, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        repository: { type: string }
        owner_id: { type: string }
        base_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        base_ref: { type: string }
        status: { type: string, enum: [active, expired, closed] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RepositoryCommit:
      type: object
      required: [sha, parents, author, authored_at, subject]
      properties:
        sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        parents:
          type: array
          items: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        author: { type: string }
        authored_at: { type: string, format: date-time }
        subject: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
    CreateChangeset:
      type: object
      required: [repository, title]
      additionalProperties: false
      properties:
        repository: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        source_branch: { type: string, minLength: 1, maxLength: 245, description: Optional non-default branch to resolve and record as the initial revision. }
        base_branch: { type: string, minLength: 1, maxLength: 245, description: "When provided, creates a pull request. Requires source_branch. The base branch to merge into." }
        expected_head_sha: { type: string, pattern: "^[0-9a-f]{40,64}$", description: "Optional. When provided, validates that the source branch HEAD matches this SHA." }
        description: { type: string, description: "Optional pull request description." }
        draft: { type: boolean, description: "Optional. If true, creates the pull request as draft." }
        issue_number: { type: integer, format: int32, minimum: 1, description: "For organization owners and admins, atomically link the new pull request to this issue in the same repository." }
    Revision:
      type: object
      required: [id, ref, commit_sha, created_at]
      properties:
        id: { type: string }
        ref: { type: string }
        commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        parent_sha: { type: string }
        base_sha: { type: string, pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$", description: "Immutable base commit used for the pull request revision comparison." }
        created_at: { type: string, format: date-time }
    Evaluation:
      type: object
      required: [id, revision_id, status, summary, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        base_sha: { type: string, pattern: "^[0-9a-f]{40,64}$", description: "Exact target-branch commit used as the evaluation base." }
        status: { type: string, enum: [pending, passed, failed] }
        summary: { type: string }
        created_at: { type: string, format: date-time }
    Evidence:
      type: object
      required: [id, revision_id, evaluation_id, kind, uri, status, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        evaluation_id: { type: string }
        kind: { type: string }
        uri: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, stale] }
        created_at: { type: string, format: date-time }
    Review:
      type: object
      required: [id, revision_id, reviewer, status, comment, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        reviewer: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, stale]
          description: A pending review superseded by a newer assignment on the same revision becomes stale, and so do the pending and approved reviews of a revision that a newer revision replaces. A rejected review stays rejected as history.
        comment: { type: string }
        created_at: { type: string, format: date-time }
    Merge:
      type: object
      required: [id, revision_id, actor, target_ref, commit_sha, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        actor: { type: string }
        target_ref: { type: string }
        commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        created_at: { type: string, format: date-time }
    PRComment:
      type: object
      required: [id, author, body, created_at]
      properties:
        id: { type: string }
        author: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        revision_id: { type: string, description: "For inline comments, the revision the comment is anchored to." }
        path: { type: string, description: "For inline comments, the file path." }
        side: { type: string, enum: [left, right], description: "For inline comments, which side of the diff." }
        line: { type: integer, minimum: 1, description: "For inline comments, the line number." }
    PullRequest:
      type: object
      required: [base_branch, source_branch, draft, closed, comments]
      properties:
        base_branch: { type: string, description: "The branch to merge into." }
        source_branch: { type: string, description: "The branch with the changes." }
        description: { type: string, description: "Optional pull request description." }
        draft: { type: boolean, description: "Whether the PR is in draft state." }
        closed: { type: boolean, description: "Whether the PR is closed (not merged)." }
        comments: { type: array, items: { $ref: "#/components/schemas/PRComment" } }
    StoredChangeset:
      type: object
      required: [changeset, status, version, created_at, updated_at]
      properties:
        changeset:
          type: object
          required: [id, created_by, repository, title, revisions, evaluations, evidence, reviews, audit]
          properties:
            id: { type: string }
            created_by: { type: string }
            repository: { type: string }
            title: { type: string }
            revisions: { type: array, items: { $ref: "#/components/schemas/Revision" } }
            evaluations: { type: array, items: { $ref: "#/components/schemas/Evaluation" } }
            evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
            reviews: { type: array, items: { $ref: "#/components/schemas/Review" } }
            merge: { $ref: "#/components/schemas/Merge" }
            pull_request: { $ref: "#/components/schemas/PullRequest" }
            audit: { type: array, items: { type: object } }
        status:
          type: string
          enum: [draft, evaluation_pending, evaluation_failed, evidence_required, review_required, in_review, changes_requested, ready_to_merge, merged]
          description: Overall state derived by the server from the current revision only. Evaluations, evidence and reviews of older revisions never count. Clients display it and must not derive it. `ready_to_merge` means the lifecycle gates recorded for the current revision are satisfied. It does not guarantee that a merge will succeed, because the merge endpoint re-validates the current target branch and review state when it runs and can refuse with 409 or 422. Clients must treat merge as a command that can fail and show the server's reason.
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChangesetPage:
      type: object
      required: [items, total, limit, offset]
      description: One page of the changesets that match every supplied filter, ordered by updated_at descending then id ascending.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StoredChangeset" }
        total:
          type: integer
          minimum: 0
          description: Number of changesets that match the filters, before limit and offset are applied.
        limit: { type: integer }
        offset: { type: integer }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
