openapi: 3.1.0
info:
  title: AgentForge API
  version: 0.7.0
  description: Persistent delivery lifecycle and organization membership API. Browser writes require a same-origin configured application origin, a session-bound CSRF token, and a trusted authenticated identity provider. Every `/organizations/{organizationID}` path accepts the organization slug or id.
servers:
  - url: /
paths:
  /api/v1/organizations/{organizationID}/merge-queue:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1merge-queue
  /api/v1/organizations/{organizationID}/merge-queue/{entry}/cancel:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1merge-queue~1{entry}~1cancel
  /api/v1/organizations/{organizationID}/pipelines/{id}/versions/{number}/merge-queue:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1versions~1{number}~1merge-queue
  /api/v1/organizations/{organizationID}/pipelines/{id}/versions/{number}/integration-runs:
    $ref: ./merge-preview.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1versions~1{number}~1integration-runs
  /api/v1/organizations/{organizationID}/pipeline-runs/{run}/promote:
    $ref: ./merge-preview.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipeline-runs~1{run}~1promote
  /api/v1/organizations/{organizationID}/merge-preview:
    $ref: ./merge-preview.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1merge-preview
  /api/v1/organizations/{organizationID}/merge-preview/capabilities:
    $ref: ./merge-preview.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1merge-preview~1capabilities
  /hooks/github/{hook}:
    $ref: ./pipelines.yaml#/paths/~1hooks~1github~1{hook}
  /api/v1/organizations/{organizationID}/pipelines/{id}/versions/{number}/runs:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1versions~1{number}~1runs
  /api/v1/organizations/{organizationID}/pipeline-runs/{run}:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipeline-runs~1{run}
  /api/v1/organizations/{organizationID}/pipeline-runs/{run}/cancel:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipeline-runs~1{run}~1cancel
  /api/v1/organizations/{organizationID}/pipeline-runs/{run}/steps/{step}/decision:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipeline-runs~1{run}~1steps~1{step}~1decision
  /api/v1/organizations/{organizationID}/pipeline-runs/{run}/events:
    $ref: ./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipeline-runs~1{run}~1events
  /api/v1/organizations/{organizationID}/pipelines/{id}/versions/{number}/validate-inputs:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1versions~1{number}~1validate-inputs"
  /api/v1/organizations/{organizationID}/pipelines:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines"
  /api/v1/organizations/{organizationID}/pipelines/{id}:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}"
  /api/v1/organizations/{organizationID}/pipelines/{id}/draft:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1draft"
  /api/v1/organizations/{organizationID}/pipelines/{id}/publish:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1publish"
  /api/v1/organizations/{organizationID}/pipelines/{id}/archive:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1archive"
  /api/v1/organizations/{organizationID}/pipelines/{id}/versions:
    $ref: "./pipelines.yaml#/paths/~1api~1v1~1organizations~1{organizationID}~1pipelines~1{id}~1versions"
  /healthz:
    get:
      operationId: getHealth
      summary: Report API process health
      security: []
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadiness
      summary: Report API, storage, and identity readiness
      security: []
      responses:
        "200":
          description: API, database, and identity dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A required database or identity dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/oidc/login:
    get:
      operationId: startOIDCLogin
      summary: Start OIDC Authorization Code flow with PKCE
      security: []
      responses:
        "302":
          description: Redirect to the configured OpenID Provider
        "503": { $ref: "#/components/responses/Problem" }
  /auth/invitations/accept:
    get:
      operationId: beginOrganizationInvitationAcceptance
      summary: Bind a one-time invitation token to the browser and begin OIDC login
      description: The invitation is not consumed until the OIDC callback validates a signed ID token with a verified email matching the invitation.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, minLength: 40, maxLength: 128 }
      responses:
        "303":
          description: Redirect to the configured OIDC login route
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/oidc/callback:
    get:
      operationId: completeOIDCLogin
      summary: Validate OIDC response and establish an application session
      security: []
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the configured application origin after session creation
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/me:
    get:
      operationId: getCurrentAccount
      summary: Get the authenticated account and its active organizations
      description: Returns only organizations where the current session user has an active membership and the organization is active. No user or organization identifier is accepted from the client.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Authenticated account context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountContext" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current application session
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204":
          description: Session revoked and authentication cookies cleared
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/members:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationMembers
      summary: List members in the selected organization
      description: Restricted to active organization owners and administrators
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Organization member page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMemberPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/members/{userID}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: userID
        required: true
        schema: { type: string }
    patch:
      operationId: updateOrganizationMember
      summary: Change a member role or active/suspended status
      description: Owners can manage all roles. Administrators can manage members and viewers but cannot grant administrative or owner privileges or modify another administrator. The last active owner cannot be demoted or suspended.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationMember" }
      responses:
        "200":
          description: Updated organization membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeOrganizationMember
      summary: Remove a member from the organization
      description: Removal is soft-deleted and audited. The last active owner cannot be removed.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Membership removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/invitations:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationInvitations
      summary: List organization invitations
      description: Restricted to active organization owners and administrators. Token values are never returned.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Invitation page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrganizationInvitation
      summary: Create a seven-day, single-use organization invitation
      description: The raw token and invitation URL are returned only once. Only verified OIDC email claims can redeem the token. Administrators may invite members and viewers, while owners may also invite administrators.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationInvitation" }
      responses:
        "201":
          description: Invitation created; protect the returned URL as a secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedOrganizationInvitation" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/invitations/{invitationID}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: invitationID
        required: true
        schema: { type: string }
    delete:
      operationId: revokeOrganizationInvitation
      summary: Revoke a pending invitation
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      responses:
        "204": { description: Invitation revoked }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/membership-audit:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationMembershipAudit
      summary: Read organization membership audit history
      description: Restricted to active organization owners and administrators. Events are returned newest first.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Membership audit page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipAuditPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/repositories:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listOrganizationRepositories
      summary: List registered organization repositories
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Organization repository catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RepositoryMetadata" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: registerOrganizationRepository
      summary: Register a repository already provisioned under the trusted Git root
      description: Owners and administrators only. The API validates the default branch against the configured local Git provider before persisting metadata.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, default_branch]
              properties:
                slug: { type: string, pattern: "^[^/]+/[^/]+$" }
                default_branch: { type: string, minLength: 1 }
      responses:
        "201":
          description: Registered repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryMetadata" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/tree:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit; omitted uses the registered default branch. The response always returns an immutable commit SHA.
        schema: { type: string }
      - in: query
        name: path
        description: Repository-relative directory path; empty selects the repository root.
        schema: { type: string, maxLength: 1024 }
    get:
      operationId: listRepositoryTree
      summary: List a repository directory at an immutable Git commit
      description: Requires active organization membership and a registered repository. Resolves ref once and returns entries pinned to the resulting full commit SHA. Directory results are bounded to 2000 entries.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit-pinned directory listing
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, path, items]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  path: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, path, kind, mode, sha]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        kind: { type: string }
                        mode: { type: string }
                        sha: { type: string }
                        size: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/history:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit; resolved once to an immutable commit SHA.
        schema: { type: string }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    get:
      operationId: listRepositoryHistory
      summary: List commits reachable from a pinned repository revision
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit history
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, items]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [sha, parents, author, authored_at, subject]
                      properties:
                        sha: { type: string }
                        parents: { type: array, items: { type: string } }
                        author: { type: string }
                        authored_at: { type: string, format: date-time }
                        subject: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/compare:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: base
        required: true
        description: Base branch, tag or commit, resolved to an immutable commit SHA.
        schema: { type: string, minLength: 1, maxLength: 256 }
      - in: query
        name: head
        required: true
        description: Head branch, tag or commit, resolved to an immutable commit SHA.
        schema: { type: string, minLength: 1, maxLength: 256 }
    get:
      operationId: compareRepositoryCommits
      summary: Compare two immutable repository commits
      description: Requires active organization membership and a registered repository. Both refs are resolved server-side before a bounded, non-renamed, non-external diff is generated. Output is limited to 1 MiB.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit comparison patch
          content:
            application/json:
              schema:
                type: object
                required: [repository, base_sha, head_sha, patch]
                properties:
                  repository: { type: string }
                  base_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  head_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  patch: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/file-history:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit resolved to an immutable SHA.
        schema: { type: string }
      - in: query
        name: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 1024 }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    get:
      operationId: listRepositoryFileHistory
      summary: List history for a file at a pinned commit
      description: Requires active organization membership and repository registration. The ref is resolved server-side and Git history is bounded to 100 commits and 1 MiB output.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: File commit history
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, path, items]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  path: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/RepositoryCommit" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/blame:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit resolved to an immutable SHA.
        schema: { type: string }
      - in: query
        name: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 1024 }
      - in: query
        name: start
        schema: { type: integer, minimum: 1, default: 1 }
      - in: query
        name: end
        schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
    get:
      operationId: blameRepositoryFile
      summary: Attribute file lines to immutable commits
      description: Requires active organization membership and repository registration. At most 500 lines and 1 MiB of Git blame output are returned for the pinned commit.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: File blame lines
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, path, start, end, items]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  path: { type: string }
                  start: { type: integer }
                  end: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [line, commit_sha, author, authored_at, summary, content]
                      properties:
                        line: { type: integer }
                        commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                        author: { type: string }
                        authored_at: { type: string }
                        summary: { type: string }
                        content: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/blob:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
      - in: query
        name: ref
        description: Branch, tag or commit; omitted uses the registered default branch.
        schema: { type: string }
      - in: query
        name: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 1024 }
    get:
      operationId: readRepositoryBlob
      summary: Read a UTF-8 Git blob at an immutable commit
      description: Requires active organization membership and a registered repository. Returns raw source text as JSON, never executes or renders repository HTML. Preview is limited to 1 MiB; binary and larger files are rejected.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit-pinned UTF-8 file content
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, blob_sha, path, encoding, content]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string }
                  blob_sha: { type: string }
                  path: { type: string }
                  encoding: { type: string, const: utf-8 }
                  content: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    get:
      operationId: listChangesets
      summary: List persisted changesets
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: repository
          description: Exact repository match.
          schema: { type: string }
        - in: query
          name: status
          description: Server-derived lifecycle status of the changeset.
          schema:
            type: string
            enum: [draft, evaluation_pending, evaluation_failed, evidence_required, review_required, in_review, changes_requested, ready_to_merge, merged]
        - in: query
          name: reviewer
          description: A user id, or the literal `me` for the authenticated user. Matches changesets whose current revision has a review assigned to that user, whatever its decision, except a review superseded by a newer assignment (status stale), which never matches. Reviews of older revisions do not count. Combine with status=in_review for a pending review queue.
          schema: { type: string }
        - in: query
          name: q
          description: Case-insensitive substring match over id, title, repository and created_by.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Changeset page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesetPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createChangeset
      summary: Create a changeset
      description: Actor identity is resolved by trusted server authentication; client-supplied actor fields are rejected.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChangeset" }
      responses:
        "201":
          description: Changeset created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getChangeset
      summary: Get a changeset and its lifecycle history
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Persisted changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/revisions:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: addRevision
      summary: Add a revision and stale prior evidence and reviews
      description: The Git provider resolves the ref to an immutable commit SHA in the registered organization repository. Previous revision evidence and reviews become stale.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref: { type: string, minLength: 1 }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/evaluations:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: recordEvaluation
      summary: Record an evaluation result for the current revision
      description: Runs trusted server-side Git diff integrity checks and persists the result and content-addressed report. Clients cannot assert evaluation outcomes.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/evidence:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: attachEvidence
      summary: Attach evidence from a passed evaluation on the current revision
      description: Evidence is generated from a persisted passing evaluation report. Client-supplied artifact URLs and digests are not accepted.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evaluation_id]
              properties:
                evaluation_id: { type: string }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/reviews:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: submitReview
      summary: Submit a review for a revision with active evidence
      description: Assigns a pending review to a verified active organization member other than the changeset author. Only that assigned reviewer can decide. A revision has one active review, so assigning a review supersedes any pending one, which becomes stale, and once the current revision has an approved review the request is refused with 409 until a new revision is added.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewer_id]
              properties:
                reviewer_id: { type: string }
                comment: { type: string }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/reviews/{reviewID}/decision:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: decideReview
      summary: Approve or reject a pending review assigned to the authenticated reviewer
      description: The authenticated user must match the assigned reviewer and the review must target the current revision.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: reviewID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                comment: { type: string }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/changesets/{id}/merge:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      operationId: mergeChangeset
      summary: Merge the current revision after server-side gate revalidation
      description: Requires a passing evaluation, active revision-bound evidence and an approved review. The Git provider performs a no-fast-forward merge into the requested target ref and persists the resulting commit SHA.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_ref]
              properties:
                target_ref: { type: string, minLength: 1 }
      responses:
        "200":
          description: Merged changeset with the actual Git merge commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/repositories/{owner}/{repo}/workspaces:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: owner
        required: true
        schema: { type: string }
      - in: path
        name: repo
        required: true
        schema: { type: string }
    post:
      operationId: createRepositoryWorkspace
      summary: Create a workspace pinned to a repository commit
      description: Requires active organization write membership and a registered repository. The base ref is resolved once to an immutable commit SHA. Workspaces expire after eight hours. This endpoint does not execute repository code.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_ref: { type: string, maxLength: 256 }
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/workspaces/{workspaceID}:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: workspaceID
        required: true
        schema: { type: string }
    get:
      operationId: getWorkspace
      summary: Get workspace metadata
      description: Access is limited to the workspace owner and organization owners or administrators.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Workspace metadata
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/workspaces/{workspaceID}/tree:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: workspaceID
        required: true
        schema: { type: string }
    get:
      operationId: listWorkspaceTree
      summary: List the pinned base tree merged with workspace overlays
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: path
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Stable directory listing with base or workspace source labels
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, base_commit_sha, path, items]
                properties:
                  workspace_id: { type: string }
                  base_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  path: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, path, kind, source]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        kind: { type: string, enum: [file, tree, symlink, commit, blob] }
                        source: { type: string, enum: [base, workspace] }
                        version: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/workspaces/{workspaceID}/diff:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: workspaceID
        required: true
        schema: { type: string }
    get:
      operationId: getWorkspaceDiff
      summary: List saved workspace additions and modifications against the pinned base commit
      description: Returns bounded file metadata only. File contents and unified patches are not included. Deletions are not yet supported.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Workspace diff metadata
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, base_commit_sha, items, total]
                properties:
                  workspace_id: { type: string }
                  base_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  total: { type: integer, minimum: 0, maximum: 2000 }
                  items:
                    type: array
                    maxItems: 2000
                    items:
                      type: object
                      required: [path, status, workspace_sha256, version]
                      properties:
                        path: { type: string }
                        status: { type: string, enum: [added, modified] }
                        base_blob_sha: { type: string }
                        workspace_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                        version: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/workspaces/{workspaceID}/changesets:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: workspaceID
        required: true
        schema: { type: string }
    post:
      operationId: createWorkspaceChangeset
      summary: Materialize the saved workspace overlay as an immutable Git revision and create a Changeset
      description: Creates a commit whose sole parent is the workspace's pinned base commit, stores it under an immutable AgentForge ref, and attaches it to the existing Changeset lifecycle. The user target branch is not moved. The saved overlay is read from one bounded repeatable-read database snapshot; at most 2,000 files and 32 MiB are accepted.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Changeset and immutable workspace revision created
          content:
            application/json:
              schema:
                type: object
                required: [changeset, workspace_id, base_commit_sha, revision_commit_sha]
                properties:
                  changeset: { $ref: "#/components/schemas/StoredChangeset" }
                  workspace_id: { type: string }
                  base_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  revision_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/workspaces/{workspaceID}/files:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: workspaceID
        required: true
        schema: { type: string }
    get:
      operationId: readWorkspaceFile
      summary: Read a file from the workspace overlay or pinned base commit
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "200":
          description: File content and optimistic version; zero denotes the immutable base file
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, path, content, sha256, version, source]
                properties:
                  workspace_id: { type: string }
                  path: { type: string }
                  content: { type: string }
                  sha256: { type: string }
                  version: { type: integer, minimum: 0 }
                  source: { type: string, enum: [base, workspace] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
    put:
      operationId: writeWorkspaceFile
      summary: Create or update a workspace file using optimistic version control
      description: Content is limited to 2 MiB. expected_version must match the current workspace overlay version; zero creates the overlay.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content, expected_version]
              additionalProperties: false
              properties:
                path: { type: string, minLength: 1, maxLength: 1024 }
                content: { type: string, maxLength: 2097152 }
                expected_version: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Persisted workspace file and new version
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, path, content, sha256, version, source]
                properties:
                  workspace_id: { type: string }
                  path: { type: string }
                  content: { type: string }
                  sha256: { type: string }
                  version: { type: integer, minimum: 1 }
                  source: { type: string, const: workspace }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }


components:
  securitySchemes:
    webhookSignature:
      $ref: ./pipelines.yaml#/components/securitySchemes/webhookSignature
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agentforge_session
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Host-agentforge_csrf
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    OrganizationMember:
      type: object
      required: [user_id, display_name, role, status, created_at, updated_at]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, invited, suspended] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationMemberPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationMember" }
        limit: { type: integer }
        offset: { type: integer }
    UpdateOrganizationMember:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, suspended] }
    CreateOrganizationInvitation:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { type: string, enum: [admin, member, viewer] }
    CreatedOrganizationInvitation:
      type: object
      required: [invitation, invitation_url, token]
      properties:
        invitation: { $ref: "#/components/schemas/OrganizationInvitation" }
        invitation_url: { type: string, format: uri }
        token: { type: string, minLength: 40, maxLength: 128 }
    OrganizationInvitation:
      type: object
      required: [id, email, role, status, invited_by, expires_at, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member, viewer] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invited_by: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    OrganizationInvitationPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationInvitation" }
        limit: { type: integer }
        offset: { type: integer }
    MembershipAuditEvent:
      type: object
      required: [id, actor_user_id, target_user_id, action, before_role, before_status, after_status, created_at]
      properties:
        id: { type: string }
        actor_user_id: { type: string }
        target_user_id: { type: string }
        action: { type: string, enum: [role_changed, suspended, reactivated, removed, invite_accepted] }
        before_role: { type: string }
        after_role: { type: [string, "null"] }
        before_status: { type: string }
        after_status: { type: string }
        created_at: { type: string, format: date-time }
    MembershipAuditPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MembershipAuditEvent" }
        limit: { type: integer }
        offset: { type: integer }
    OrganizationSummary:
      type: object
      required: [id, slug, name, role]
      properties:
        id: { type: string }
        slug:
          type: string
          description: Organization handle, usable in place of the organization id in any `/organizations/{organizationID}` path. Stored slugs are unique and match `^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$`; `current` is reserved and never assigned. An organization created without a slug (for example by direct SQL) reports its id, which may not match that pattern.
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
    AccountContext:
      type: object
      required: [user_id, display_name, organizations]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        email: { type: string }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrganizationSummary" }
    RepositoryMetadata:
      type: object
      required: [organization_id, slug, default_branch, created_by, created_at, updated_at]
      properties:
        organization_id: { type: string }
        slug: { type: string }
        default_branch: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Workspace:
      type: object
      required: [id, organization_id, repository, owner_id, base_commit_sha, base_ref, status, expires_at, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        repository: { type: string }
        owner_id: { type: string }
        base_commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        base_ref: { type: string }
        status: { type: string, enum: [active, expired, closed] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RepositoryCommit:
      type: object
      required: [sha, parents, author, authored_at, subject]
      properties:
        sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        parents:
          type: array
          items: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        author: { type: string }
        authored_at: { type: string, format: date-time }
        subject: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
    CreateChangeset:
      type: object
      required: [repository, title]
      additionalProperties: false
      properties:
        repository: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
    Revision:
      type: object
      required: [id, ref, commit_sha, created_at]
      properties:
        id: { type: string }
        ref: { type: string }
        commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        parent_sha: { type: string }
        created_at: { type: string, format: date-time }
    Evaluation:
      type: object
      required: [id, revision_id, status, summary, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        base_sha: { type: string, pattern: "^[0-9a-f]{40,64}$", description: "Exact default-branch commit used as the evaluation base." }
        status: { type: string, enum: [pending, passed, failed] }
        summary: { type: string }
        created_at: { type: string, format: date-time }
    Evidence:
      type: object
      required: [id, revision_id, evaluation_id, kind, uri, status, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        evaluation_id: { type: string }
        kind: { type: string }
        uri: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, stale] }
        created_at: { type: string, format: date-time }
    Review:
      type: object
      required: [id, revision_id, reviewer, status, comment, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        reviewer: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, stale]
          description: A pending review superseded by a newer assignment on the same revision becomes stale, and so do the pending and approved reviews of a revision that a newer revision replaces. A rejected review stays rejected as history.
        comment: { type: string }
        created_at: { type: string, format: date-time }
    Merge:
      type: object
      required: [id, revision_id, actor, target_ref, commit_sha, created_at]
      properties:
        id: { type: string }
        revision_id: { type: string }
        actor: { type: string }
        target_ref: { type: string }
        commit_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        created_at: { type: string, format: date-time }
    StoredChangeset:
      type: object
      required: [changeset, status, version, created_at, updated_at]
      properties:
        changeset:
          type: object
          required: [id, created_by, repository, title, revisions, evaluations, evidence, reviews, audit]
          properties:
            id: { type: string }
            created_by: { type: string }
            repository: { type: string }
            title: { type: string }
            revisions: { type: array, items: { $ref: "#/components/schemas/Revision" } }
            evaluations: { type: array, items: { $ref: "#/components/schemas/Evaluation" } }
            evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
            reviews: { type: array, items: { $ref: "#/components/schemas/Review" } }
            merge: { $ref: "#/components/schemas/Merge" }
            audit: { type: array, items: { type: object } }
        status:
          type: string
          enum: [draft, evaluation_pending, evaluation_failed, evidence_required, review_required, in_review, changes_requested, ready_to_merge, merged]
          description: Overall state derived by the server from the current revision only. Evaluations, evidence and reviews of older revisions never count. Clients display it and must not derive it. `ready_to_merge` means the lifecycle gates recorded for the current revision are satisfied. It does not guarantee that a merge will succeed, because the merge endpoint re-validates the current target branch and review state when it runs and can refuse with 409 or 422. Clients must treat merge as a command that can fail and show the server's reason.
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChangesetPage:
      type: object
      required: [items, total, limit, offset]
      description: One page of the changesets that match every supplied filter, ordered by updated_at descending then id ascending.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StoredChangeset" }
        total:
          type: integer
          minimum: 0
          description: Number of changesets that match the filters, before limit and offset are applied.
        limit: { type: integer }
        offset: { type: integer }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
