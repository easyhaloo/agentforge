  /api/v1/organizations/{organizationID}/changesets/{id}/reviews:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
    post:
      operationId: submitReview
      summary: Submit a review for a revision with active evidence
      description: Assigns a pending review to a verified active organization member other than the changeset author. Only that assigned reviewer can decide. A revision has one active review, so assigning a review supersedes any pending one, which becomes stale, and once the current revision has an approved review the request is refused with 409 until a new revision is added.
