            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                revision_id: { type: string, description: "For inline comments, the revision to anchor to." }
                path: { type: string, description: "For inline comments, the file path." }
                side: { type: string, enum: [left, right], description: "For inline comments, which side of the diff." }
                line: { type: integer, minimum: 1, description: "For inline comments, the line number." }
      responses:
        "200":
