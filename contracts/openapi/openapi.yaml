                target_ref: { type: string, minLength: 1 }
      responses:
        "200":
          description: Merged changeset with the actual Git merge commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/comparison:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getChangesetComparison
      summary: Get the comparison (diff) for the active revision
      description: Returns the three-dot diff between the base and the current revision. For pull requests, uses the evaluated base SHA if available, otherwise the base branch. For non-PR changesets, uses the repository default branch.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                required: [base_sha, head_sha, patch]
                properties:
                  base_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  head_sha: { type: string, pattern: "^[0-9a-f]{40,64}$" }
                  patch: { type: string }
                  commits: { type: array, items: { type: object } }
                  commits_truncated: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations/{organizationID}/changesets/{id}/pull-request/state:
