      description: Requires active organization membership and a registered repository. Returns raw source text as JSON, never executes or renders repository HTML. Preview is limited to 1 MiB; binary and larger files are rejected.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Commit-pinned UTF-8 file content
