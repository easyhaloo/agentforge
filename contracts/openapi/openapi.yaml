                comment: { type: string }
      responses:
        "200":
          description: Updated changeset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredChangeset" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/organizations/{organizationID}/changesets/{id}/merge:
    parameters:
      - in: path
        name: organizationID
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      operationId: mergeChangeset
      summary: Merge the current revision after server-side gate revalidation
      description: Requires a passing evaluation, active revision-bound evidence and an approved review. Matching branch rulesets may block the merge or require a linked pull request targeting this exact branch. The Git provider performs a no-fast-forward merge into the requested target ref and persists the resulting commit SHA.
      security: [{ sessionCookie: [], csrfCookie: [], csrfToken: [] }]
      requestBody:
        required: true
